rest_only:
  note: >-
    The REST surface is far larger than the MCP surface. 258 of 298 catalogued REST operations have no
    MCP tool, including the whole GN IDS content-submission API (74 operations, the only write surface
    Gracenote publishes), the Nexus automotive API (39), the GVD ingestion feed (13), the Global Sports
    Data Update API (13) and the Online Video and Social APIs (6). The MCP servers are read-only,
    LLM-shaped projections over video and sports lookup; nothing Gracenote publishes lets an agent
    write through MCP.
