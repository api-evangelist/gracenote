provider: Gracenote
providerId: gracenote
description: >-
  Binds each published Gracenote MCP tool to the REST operation(s) that serve the same data. The live
  MCP tools/list is OAuth-gated (HTTP 401 on an anonymous probe of both servers), so tool inputSchemas
  could not be read from the wire; tools are mapped from Gracenote's own tool-reference pages by name
  and documented semantics. Confidence is recorded honestly per row.
caveats:
- The Video MCP Server is not a thin proxy over one REST API. Its tools return a curated,
  LLM-shaped projection (entity resolution, availability, images, cast, awards, ratings) whose nearest
  REST equivalents are spread across the OnConnect Lookup APIs and the On API.
- The OnConnect, On API and GVD specs declare NO operationIds (0 of 72 operations across the three),
  so REST bindings for video tools are given as `METHOD path` rather than operationId. The Global
  Sports Data Lookup API does declare operationIds for all 73 operations, so sports rows bind to real ids.
- gnv_web_search has no REST counterpart at all — it is a web-search pre-processing step the MCP
  server performs on the LLM's behalf.
