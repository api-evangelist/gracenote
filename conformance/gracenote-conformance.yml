domain_standards:
- id: tms-id
  name: TMS ID / Gracenote IDs (de facto video content identifier)
  conforms: true
  evidence: >-
    tmsId is a first-class path and query identifier across the OnConnect Lookup APIs
    (GET /v1.1/programs/{tmsId}) and the On API, and the GN IDS API exists specifically to submit and
    publish programs against Gracenote-licensed datasets using these IDs. Gracenote's own portal calls
    them "the industry's most widely adopted video IDs". This is a proprietary identifier scheme that
    functions as a market standard, not an open specification — recorded as such.
  note: >-
    Reward-only check. The video-metadata market has no open, body-published content-identifier
    standard equivalent to SCIM or FHIR; Gracenote's IDs are the closest thing, and they are
    Gracenote's own.
- id: iso-639-1
  name: ISO 639-1 / IETF BCP 47 language tags
  conforms: true
  evidence: >-
    The Video MCP Server's gnv_resolve_entities and gnv_get_root tools take language as "ISO 639-1 or
    IETF tag (e.g. en, en-US)"; the video specs use the same convention.
- id: iso-3166
  name: ISO 3166 country codes
  conforms: true
  evidence: >-
    gnv_resolve_entities and gnv_get_availability take countryCode as ISO 3166-1 alpha-3 ("USA",
    "GBR"); gnv_web_search takes ISO 3166-1 alpha-2. The OnConnect Online Video and Social API
    enumerates AU, BR, CA, DE, ES, FR, IT, MX, SE, UK, US.
