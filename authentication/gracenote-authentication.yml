provider: Gracenote
providerId: gracenote
description: >-
  Gracenote runs two distinct authentication models. Every REST product is API-key authenticated and
  keys are issued by sales, not self-serve — the developer portal's own onboarding copy is "New to
  Gracenote? Create an account and contact Sales for an API key." The MCP servers are the exception:
  they are OAuth 2.0 protected resources with full RFC 8414 / RFC 9728 discovery and dynamic client
  registration.
summary:
  types:
  - apiKey
  - oauth2
  api_key_in:
  - query
  - header
  self_serve_credentials: false
  credential_issuer: Gracenote sales / account team
schemes:
- name: apiKey
  type: apiKey
  in: query
  parameter: api_key
  description: >-
    The OnConnect family (legacy developer.tmsapi.com gateway and the current OnConnect Lookup APIs)
    takes the key as an api_key query parameter. The Mashery gateway returns
    403 ERR_403_DEVELOPER_INACTIVE without a valid, active key.
  sources:
  - openapi/gracenote-onconnect-lookup-apis-openapi.json
  - openapi/gracenote-celebrities-api-openapi.yml
  - openapi/gracenote-lineups-api-openapi.yml
