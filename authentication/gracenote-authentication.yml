  - openapi/gracenote-series-api-openapi.yml
  - openapi/gracenote-sports-api-openapi.yml
  - openapi/gracenote-stations-api-openapi.yml
- name: ApiKeyAuth
  type: apiKey
  in: header
  parameter: GN-APIKEY
  description: API key provided during registration; used by the GMD v3 music API and the GN IDS API.
  sources:
  - openapi/gracenote-gmd-api-v3-openapi.json
  - openapi/gracenote-gn-ids-api-openapi.json
- name: mcp-oauth2
  type: oauth2
  description: >-
    Both production MCP servers are OAuth 2.0 protected resources. Anonymous JSON-RPC returns 401 with
    a WWW-Authenticate Bearer challenge carrying resource_metadata, so a compliant MCP client discovers
    the authorization server automatically. Dynamic client registration is offered at /register on each
    MCP host; PKCE S256 is supported; the documented machine-to-machine path is a client-credentials
    grant at https://auth.mcp.gracenote.com/oauth2/token returning a one-hour access token. Gracenote
    documents that the MCP server does not enforce scopes on M2M tokens.
  flows:
  - authorization_code
  - refresh_token
  - client_credentials
  pkce: S256
  token_endpoint: https://auth.mcp.gracenote.com/oauth2/token
  scopes_supported:
  - openid
  upstream_idp: https://cognito-idp.us-west-2.amazonaws.com/us-west-2_ASUkV5fbV
  applies_to:
  - https://video.mcp.gracenote.com/mcp
  - https://sports.mcp.gracenote.com/mcp
  sources:
  - well-known/gracenote-video-mcp-oauth-authorization-server.json
  - well-known/gracenote-sports-mcp-oauth-authorization-server.json
  - https://devportal.gracenote.com/video/video-mcp-server/connecting-to-mcp
- name: wordpress-mcp-oauth2
  type: oauth2
  description: >-
    Separate from the products: the gracenote.com marketing site (WordPress VIP) publishes its own
    authorization-server metadata with a single `mcp` scope and a public-client (`none`) token
    endpoint auth method, backing https://gracenote.com/wp-json/mcp/mcp-oauth-server.
  flows:
  - authorization_code
  - refresh_token
  pkce: S256
  scopes_supported:
  - mcp
  sources:
  - well-known/gracenote-oauth-authorization-server.json
portal_auth:
  developer_portal: https://devportal.gracenote.com/
  sign_in: https://devportal.gracenote.com/login
  sign_up: https://devportal.gracenote.com/register
  idp: AWS Cognito (auth.devportal.gracenote.com)
  note: >-
    Portal accounts are self-registerable; API keys are not. Existing legacy accounts on
