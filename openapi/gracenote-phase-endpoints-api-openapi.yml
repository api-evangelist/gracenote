openapi: 3.2.0
info:
  title: Global Sports Data Lookup API v1 Phase Endpoints API
  description: This page contains all Lookup API endpoints that are part of our Core Sports Data.
  version: '1'
servers:
- url: /proxy/sports
tags:
- name: Phase Endpoints
paths:
  /gsd/lookup/v1/phases/{phaseId}:
    get:
      tags:
      - Phase Endpoints
      summary: Phase Info
      operationId: PhaseInfo
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: phaseId
        in: path
        required: true
        schema:
          type: string
          default: GNF057JFZJSXMEX
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/phases/{phaseId}/results:
    get:
      tags:
      - Phase Endpoints
      summary: Results by Phase
      operationId: ResultsbyPhase
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: phaseId
        in: path
        required: true
        schema:
          type: string
          default: GNF057JFZJSXMEX
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/phases/{phaseId}/classifications:
    get:
      tags:
      - Phase Endpoints
      summary: Classifications by Phase
      operationId: ClassificationsbyPhase
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: phaseId
        in: path
        required: true
        schema:
          type: string
          default: GNF057JFZJSXMEX
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/phases/{phaseId}/intermediates:
    get:
      tags:
      - Phase Endpoints
      summary: Intermediates by Phase
      operationId: IntermediatesbyPhase
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: phaseId
        in: path
        required: true
        schema:
          type: string
          default: GNC0RGPCA5JAYS7
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
components:
  parameters:
    AcceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        enum:
        - application/json
        default: application/json
    ApiKeyQuery:
      name: api_key
      in: query
      required: true
      description: API key for authentication
      schema:
        type: string
    LanguageQuery:
      name: language
      in: query
      description: Language Code which will translate all translatable fields into the requested language.
      schema:
        type: string
        enum:
        - ''
        - ar-SA
        - cs-CZ
        - da-DK
        - de-DE
        - el-GR
        - en-GB
        - en-US
        - es-ES
        - fi-FI
        - fr-FR
        - hu-HU
        - it-IT
        - ja-JP
        - ko-KR
        - nb-NO
        - nl-BE
        - nl-NL
        - pl-PL
        - pt-BR
        - pt-PT
        - ro-RO
        - ru-RU
        - sv-SE
        - tr-TR
        - zh-CN
        - zh-HK
        default: en-GB
