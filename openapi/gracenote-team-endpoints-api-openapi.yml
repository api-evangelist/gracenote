openapi: 3.2.0
info:
  title: Global Sports Data Lookup API v1 Team Endpoints API
  description: This page contains all Lookup API endpoints that are part of our Core Sports Data.
  version: '1'
servers:
- url: /proxy/sports
tags:
- name: Team Endpoints
paths:
  /gsd/lookup/v1/teams/{teamId}:
    get:
      tags:
      - Team Endpoints
      summary: Team Info
      operationId: TeamInfo
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          default: GNDDXMAJZPWET9S
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/teams/{teamId}/schedule-results:
    get:
      tags:
      - Team Endpoints
      summary: Schedule and Results by Team
      operationId: ScheduleandResultsbyTeam
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          default: GNDDXMAJZPWET9S
      - name: timeFrom
        in: query
        required: true
        description: 'Here you can define the lower bound of the time range, which follows the ISO time structure: yyyy-MM-ddTHH:mm:ssZ. The max range between timeFrom and timeTo is 31 days and timeFrom should be earlier than timeTo.'
        schema:
          type: datetime
          default: '2022-04-01T00:00:00'
      - name: timeTo
        in: query
        required: true
        description: 'Here you can define the upper bound of the time range, which follows the ISO time structure: yyyy-MM-ddTHH:mm:ssZ. The max range between timeFrom and timeTo is 31 days and timeFrom should be earlier than timeTo.'
        schema:
          type: datetime
          default: '2022-05-01T00:00:00'
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/teams/{teamId}/previous-results:
    get:
      tags:
      - Team Endpoints
      summary: Previous Results by Team
      operationId: PreviousResultsbyTeam
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          default: GNDDXMAJZPWET9S
      - name: skip
        in: query
        required: true
        description: Skip this number of elements in the response. If provided, it must be a non-negative integer and it must be provided together with the limit parameter.
        schema:
          type: string
          default: '0'
      - name: limit
        in: query
        required: true
        description: Limit for the number of elements in the response. If provided, it must be a positive integer and it must be provided together with the skip parameter.
        schema:
          type: string
          default: '5'
      - name: timeBefore
        in: query
        required: false
        description: 'Defined the point in time from which you want to retrieve previous results. It needs to be provided in the ISO time structure: yyyy-MM-ddTHH:mm:ssZ. If provided, it will only return matches for with a scheduledStartTimeUtc is before this time.'
        schema:
          type: datetime
          default: ''
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/teams/{teamId}/league-season-overview:
    get:
      tags:
      - Team Endpoints
      summary: League and League Seasons by Team
      operationId: LeagueandLeagueSeasonsbyTeam
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          default: GNDDXMAJZPWET9S
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
components:
  parameters:
    AcceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        enum:
        - application/json
        default: application/json
    ApiKeyQuery:
      name: api_key
      in: query
      required: true
      description: API key for authentication
      schema:
        type: string
    LanguageQuery:
      name: language
      in: query
      description: Language Code which will translate all translatable fields into the requested language.
      schema:
        type: string
        enum:
        - ''
        - ar-SA
        - cs-CZ
        - da-DK
        - de-DE
        - el-GR
        - en-GB
        - en-US
        - es-ES
        - fi-FI
        - fr-FR
        - hu-HU
        - it-IT
        - ja-JP
        - ko-KR
        - nb-NO
        - nl-BE
        - nl-NL
        - pl-PL
        - pt-BR
        - pt-PT
        - ro-RO
        - ru-RU
        - sv-SE
        - tr-TR
        - zh-CN
        - zh-HK
        default: en-GB
