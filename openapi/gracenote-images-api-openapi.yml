    post:
      tags:
      - Images
      summary: Create a new image
      description: 'Create a new image resource. Accepts JSON image data in the request body.


        It is necessary to have the image register entitlement to use this endpoint.


        ### Below are the list of categories (confirming) those can be used while registering an image.


        1. __Production Art (Texted)__ - Home video movie art that includes the movie title only

        (does not contain billing block). Promotional series art that includes the show title only.

        Deliver the most recent/upcoming season artwork and previous season artwork upon request.

        Actor names and taglines are also acceptable. Layered files are preferred.


        2. __Production Art (Textless)__ - Promotional Key Art without any text. Promotional series should

        be centered and represent the show by featuring leading cast or scenic elements. Ideally, the

        textless artwork matches the texted key art, but this is not a requirement.


        3. __Still Frame__ - For a movie, 5-10 images from a scene in the movie. For an episode, 3-5 unique

        images from scenes from the episode. The show should have multiple images for each episode in

        the season. Contains no text.

        __Note__: Do not send: Behind-the-scenes photos. (green screens, visible microphones, directors on-set).


        4. __Backdrop__ - For movie and show, right-justified, full-frame art. For the movie that does not contain

        any text.

        __Note__: For a show, do not apply a gradient that conceals any part of the image.


        5. __Title Treatment__ - The title of a movie or series with a transparent background. Layered files only.

        Vector, TIFF, PNG or PSD files are acceptable.

        __Note__: Title Treatment should not include channel or streaming service logo or branding.


        6. __Cast in Character__ - Cast images of of a celebrity or host as their character. Separate from celebrity images.


        7. __Cast Ensemble__ - Cast images as part of program image library. Separate from celebrity images.


        ### Below table provides confirming programType mapping for category and aspect ratio.


        Category | Aspect Ratio |

        | 2:3 | 3:4 | 4:3 | 16:9 | 2:1 | 1:1 | 9:5 |

        Production Art(Texted) | M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| |

        Production Art(Textless)| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| |

        Still Frame | M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| |

        Backdrop | | | | M,SH,SE,E| | | |

        Title Treatment | | | | | | | M,SH,SE,E|

        Cast in Character | | M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| | | |

        Cast Ensemble | | M,SH,SE,E| M,SH,SE,E| M,SH,SE,E| | | |


        ### Legend:


        M - Movie


        SH - Show/Series


        SE - Season


        E - Episode'
      operationId: createImage
