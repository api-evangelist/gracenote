          format: uri
        created:
          type: string
          description: The time at which the image was created in system.
          readOnly: true
        gnID:
          type: string
          description: The Gracenote ID of the Image.
          readOnly: true
        updated:
          type: string
          description: The time at which the image was last updated in system.
          readOnly: true
    MetaResponse:
      required:
      - rayID
      type: object
      properties:
