      - name: page
        in: query
        required: true
        schema:
          minimum: 1
          type: integer
          format: int64
      - name: aspectRatio
        in: query
        description: Aspect Ratios to filter images by.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: category
        in: query
        description: Image categories to filter by.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: language
        in: query
        description: 'Language string to filter by.

          Results may have overlap but not strictly be a sub-set.'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: market
        in: query
        description: 'Market string to filter by.

          Results may have overlap but not strictly be a sub-set.'
