      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    ProgramImage:
      title: ProgramImage represents the relationship between an Image and a Presentation.
      required:
      - imageGnID
      - presentationGnID
      type: object
      properties:
        imageGnID:
          type: string
          description: ImageID is the GnID of an image.
          examples:
          - GNLZZZ200000004
        isConforming:
          type: boolean
          description: 'IsConforming indicates if the Image conforms to Gracenote Rich Media

            categorical image standards with respect to the mapped Presentation.'
          readOnly: true
        presentationGnID:
          type: string
          description: PresentationGnID is the GnID of a Presentation.
          examples:
          - GNLZZXT00000004
    DeletedImage:
      title: DeletedImage represents a a deleted image.
      type: object
      properties:
        gnID:
          type: string
          description: The Gracenote ID of the deleted image.
    Description:
      required:
      - language
      - length
      - value
      type: object
      properties:
        language:
          type: string
          description: 'Language of the description''s text. User must be entitled to use the language.

            See the Gracenote Vocabulary for valid languages.'
        length:
          type: integer
          description: 'Length defines the maximum number of characters that can be used in a description.

            The value of the description must be less than or equal to the specified length from values 1 to 1000.'
          format: int64
        value:
          type: string
          description: Value is the raw text description of a program.
      description: Description is a set of fields that describe a program
    ProgramImagesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProgramImage'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    AspectRatio:
      title: AspectRatio defines aspect ratio values which are known to conform.
      type: string
      description: Custom aspect ratios may be used, but they will never conform.
    NewImage:
      required:
      - category
      - dimensions
      - fileType
      - title
      - url
      type: object
      properties:
        brandDescription:
          type: string
          description: 'Description that indicates the branding applied to the image.

            If the description is provided, then branded is assumed to be true.

            brandDescription is not required, even if branded is specified as true.

            Cannot exceed 1000 character length limit.'
        branded:
          type: boolean
          description: Indicates that the image has branded content such as a source, channel, or network name or logo.
          default: false
        category:
          $ref: '#/components/schemas/Category'
        customAttributes:
          type: object
          additionalProperties:
            type: string
          description: Custom key:value pairs to associate with the image.
        description:
          $ref: '#/components/schemas/Description'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        fileType:
          type: string
          description: The media or file-type of the image at the URL.
          enum:
          - bmp
          - ' psd'
          - ' jpeg'
          - ' jpg'
          - ' tiff'
          - ' png'
        gracenoteUsage:
          type: boolean
          description: 'Indicates that the client agrees that, upon a successful publish request,

            Gracenote may use the provided image in Gracenote''s customer-facing datasets.

            If the client does not agree, then this field should be set to false.'
          default: true
        languages:
          type: array
          description: Primary languages used in the image.
          items:
            type: string
          examples:
          - - en
            - en-GB
            - en-AU
            - es
            - es-ES
        markets:
          type: array
          description: 'Applicable markets for the image.

            Must conform to GN Vocabulary (ISO 3166-1 Alpha-2 codes).'
          items:
            type: string
          examples:
          - - US
            - MX
            - ES
            - AU
            - GB
        productionDate:
          type: string
          description: The ISO-8601 date that the image was originally created.
          format: date
        sensitive:
          type: boolean
          description: Indicates that the image contains sensitive material.
          default: false
        tags:
          type: array
          description: Custom tags to associate with the image.
          items:
            type: string
        title:
          type: string
          description: The tile (or name) of the image. Cannot exceed 1000 character length limit.
        url:
          type: string
          description: The URL at which the image file may be accessed. Cannot exceed 8000 character length limit.
          format: uri
      description: NewImage represents the metadata for creating a new image
    Category:
      title: Category defines known categorical image types may conform.
      type: string
      description: Custom categories may be used, but they will not be conforming.
    Dimensions:
      required:
      - aspectRatio
      - height
      - width
      type: object
      properties:
