    NameObject:
      title: name object
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: false
        languageContext:
          nullable: false
          type: object
          description: The language contexts of the name. Only visible to Customers with GMD Discovery/Advanced Discovery package and above
          items:
            $ref: '#/components/schemas/LanguageContext_2'
      required:
      - name
    ArtistShort:
      title: artist
      type:
      - object
      - 'null'
      additionalProperties: false
      properties:
        artistID:
          nullable: false
          type: string
          description: Gracenote Artist ID
        artistName:
          nullable: false
          type: string
          description: Artist Name
      required:
      - artistID
      - artistName
    ResponseMeta_2:
      title: meta object
      type: object
      additionalProperties: false
      nullable: false
      properties:
        total:
          type: integer
          nullable: false
          description: Total data objects for the query criteria
        count:
          type: integer
          nullable: false
          description: Count of objects in the returned result set
        offset:
          type: integer
          nullable: false
          description: Current offset for result set
        references:
          type: object
          additionalProperties: false
          properties:
            genreList:
              type: string
              description: Hierarchical Genre List used for response.
            displayLanguage:
              type: string
              description: Display language used for descriptor strings.
      required:
      - total
      - count
      - offset
      examples:
      - total: 1
        count: 1
        offset: 0
        references:
          genreList: GENRES-US-DETAILED
          displayLanguage: en
    Image_2:
      title: image
      type: object
      additionalProperties: false
      properties:
        imageType:
          type: string
          description: 'Image type identifier. Classic artist images: artistImage-promotional, artistImage-inPerformance, artistImage-redCarpet, artistImage-other. Enhanced artist images: artistImage-headshot, artistImage-iconic, artistImage-backdrop. Album images: coverArt.'
          enum:
          - artistImage-promotional
          - artistImage-inPerformance
          - artistImage-redCarpet
          - artistImage-other
          - artistImage-headshot
          - artistImage-iconic
          - artistImage-backdrop
          - coverArt
        imageID:
          type: string
          nullable: false
        preferred:
          type: string
          description: 'Indicates if this is a preferred image. Only present for classic artist images. Values: ''true'' or ''false''.'
          enum:
          - 'true'
          - 'false'
        assets:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/Asset'
      required:
      - imageType
      - imageID
      - assets
    PopularityObject:
      title: regional popularity
      nullable: false
      type: object
      additionalProperties: false
      properties:
        region:
          nullable: false
          type: string
        oneYear:
          type:
          - number
          - 'null'
        oneMonth:
          type:
          - number
          - 'null'
      required:
      - region
      - oneYear
      - oneMonth
    Asset:
      title: image asset
      type: object
      additionalProperties: false
      properties:
        size:
          type: string
          nullable: false
        height:
          type: integer
          nullable: false
        width:
          type: integer
          nullable: false
        url:
          type: string
          pattern: ^https://
      required:
      - size
      - height
      - width
      - url
    LanguageContext_2:
      type:
      - object
      - 'null'
      additionalProperties: false
      properties:
        language:
          type:
          - string
          - 'null'
        script:
          type:
          - string
          - 'null'
      required:
      - language
      - script
    ArtistShortWithOrd:
      title: artist
      type: object
      additionalProperties: false
      properties:
        artistID:
          nullable: false
          type: string
          description: Gracenote Artist ID
        artistName:
          nullable: false
          type: string
          description: Artist Name
        ord:
          type: integer
          description: Group members are ordered according to their relevance.
      required:
      - artistID
      - artistName
      - ord
    DescriptorObject_2:
      nullable: false
      title: descriptor object
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          type:
            type: string
            enum:
            - artistTypes
            - eras
            - genres
            - languages
            - moods
            - origins
            - styles
            - tempos
          weight:
            type: integer
          hierarchy:
            nullable: false
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                label:
                  nullable: false
                  type: string
                descriptorID:
                  nullable: false
                  type: string
                level:
                  type: integer
        required:
        - type
        - weight
        - hierarchy
    PopularAlbumEditionObject:
      title: popular album edition data
      description: 'The popular album edition of an artist. Only visible to Customers with GMD artist-enhanced-image add on.

        '
      type:
      - object
      - 'null'
      additionalProperties: false
      properties:
        albumEditionID:
          type: string
          nullable: false
        albumEditionName:
          type: string
          nullable: false
        images:
          $ref: '#/components/schemas/PopularAlbumEditionImagesObject'
      required:
      - albumEditionID
      - albumEditionName
    ErrorResponse_2:
      title: error response
      type: object
      additionalProperties: false
      nullable: false
      properties:
        status:
          type: integer
          nullable: false
        error:
          type: string
          nullable: false
          enum:
          - page_not_found
          - resource_not_found
          - invalid_query_parameter_key
          - invalid_query_parameter_value
          - missing_query_parameter_key
          - resource_type_error
          - internal_server_error
          - unauthorized_invalid_api_key
          - unauthorized_missing_api_key
          - missing_api_key
          - rate_limit_exceeded
          - missing_entitlement
        description:
          type: string
          nullable: false
      required:
      - status
      - error
      - description
    PopularAlbumEditionImagesObject:
      title: popular album edition image data
      type: object
      additionalProperties: false
      nullable: false
      properties:
        albumImages:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/Asset'
      required:
      - albumImages
    AlternateNameObject:
      title: alternate name object
      type: object
      additionalProperties: false
      properties:
        artistName:
          type: string
          nullable: false
        languageContext:
          nullable: false
          type: object
          description: The language contexts of the name. Only visible to Customers with GMD Discovery/Advanced Discovery package and above
          items:
            $ref: '#/components/schemas/LanguageContext_2'
      required:
      - artistName
    PopularityData:
      title: popularity data
      description: 'Popularity score is on a scale of 0 to 1, with a resolution out to 5 decimal places, which is derived

        from a proprietary blend of signals and indicates the relative All-Time, or Recent popularity of Artists

        and Recordings.

        Only visible to Customers with Popularity Add On

        '
      type:
      - object
      - 'null'
      additionalProperties: false
      properties:
        overall:
          nullable: false
          type: array
          items:
            $ref: '#/components/schemas/PopularityObject'
        audio:
          nullable: false
          type: array
          items:
            $ref: '#/components/schemas/PopularityObject'
        video:
          nullable: false
          type: array
          items:
            $ref: '#/components/schemas/PopularityObject'
      required:
      - overall
      - audio
      - video
