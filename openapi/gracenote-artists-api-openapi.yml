openapi: 3.2.0
info:
  title: Gracenote Artists API
  version: '1.0'
  description: 'Operations tagged Artists across 2 of this provider''s published API definitions: gracenote-gmd-api-v2-openapi.json, gracenote-gmd-api-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /proxy/gmd/v2
- url: https://api.gmd.music.gracenote.com/v3
tags:
- name: Artists
paths:
  /artists/search:
    get:
      tags:
      - Artists
      summary: Artist text search
      description: Text search for `Artist` objects using artist name.
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
      - $ref: '#/components/parameters/artistName'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/categoriesLanguage'
      - $ref: '#/components/parameters/genreCategories'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  data:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/ArtistObject'
                required:
                - meta
                - data
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      operationId: getArtistsSearch
      x-operation-id-source: derived
    servers:
    - url: /proxy/gmd/v2
  /artists/{idType}:
    get:
      tags:
      - Artists
      summary: Lookup Artist(s) by ID
      description: 'Get `Artist` object(s) by ID


        **Notes**

        * Objects are returned in order requested.

        * If an object is not found, a `null` value is returned in its position.

        * Duplicate ids in the query will result in duplicate objects in the response

        * TMS Party ID lookups require TMS ID add-on.

        * Spotify Artist ID lookups require Spotify IDs add-on.


        **Example:** Lookup by Gracenote ID


        `https://.../artists/gnid?ids=GND6CJFDB6BH1X3`


        **Example:** Lookup by tms-music-party-id


        `https://.../artists/tms-music-party-id?ids=521029`


        **Example:** Lookup by spotify-artist-id


        `https://.../artists/spotify-artist-id?ids=0d25ed8c5cc94cdbaf8e9961419ed6be`'
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
      - $ref: '#/components/parameters/artistIDType'
      - $ref: '#/components/parameters/ids'
      - $ref: '#/components/parameters/categoriesLanguage'
      - $ref: '#/components/parameters/genreCategories'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  data:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/ArtistObject'
                required:
                - meta
                - data
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      operationId: getArtistsByIdType
      x-operation-id-source: derived
    servers:
    - url: /proxy/gmd/v2
  /artists/lookup:
    get:
      tags:
      - Artists
      summary: Lookup Artist(s) by ID
      description: 'Get `Artist` object(s) by ID


        **Notes**

        * Objects are returned in order requested.

        * Only one object is returned per ID. *if the input ID matches multiple objects, only one will be returned.*

        * If an object is not found, a 404 is returned along with a message indicating which ID wasn''t found.

        * Duplicate ids in the query will result in a 400 response.

        * GN TMS Person ID lookups require GN TMS Person ID add-on.


        **Example:** Lookup by Gracenote ID


        `https://.../artists/lookup?ids=GND6CJFDB6BH1X3&idType=artistID`


        **Example:** Lookup by personID


        `https://.../artists/lookup?ids=521029&idType=personID`'
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
      - $ref: '#/components/parameters/idTypeArtists'
      - $ref: '#/components/parameters/ids_2'
      - $ref: '#/components/parameters/displayLanguage'
      - $ref: '#/components/parameters/genreList'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta_2'
                  data:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/ArtistObject_2'
                required:
                - meta
                - data
        '400':
          $ref: '#/components/responses/ErrorResponse400_2'
        '404':
          $ref: '#/components/responses/ErrorResponse404_2'
      security:
      - ApiKeyAuth: []
      operationId: getArtistsLookup
      x-operation-id-source: derived
    servers:
    - url: https://api.gmd.music.gracenote.com/v3
  /artists/explore:
    get:
      tags:
      - Artists
      summary: Explore Artist(s)
      description: 'Get `Artist` object(s) - optionally filtered and sorted.


        Without any query parameters, the `explore` Artists endpoint will return the most highly consumed artists Globally over the past year. Additional parameters including Gracenote Descriptors such as genres and origins can be added as parameters to further filter the set of retrievable artists.


        ***Note: You can add an `artistID` filter parameter to allow using `includeRelatedArtists` to return artists that are related to the seed artist. Use `omitSeedArtists` to not include the seed Artist in the result set.***


        **Example:** Explore popular artists


        `https://.../artists/explore`"'
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
      - $ref: '#/components/parameters/sortArtists'
      - $ref: '#/components/parameters/popularityRegion'
      - $ref: '#/components/parameters/artistIDs'
      - $ref: '#/components/parameters/includeRelatedArtists'
      - $ref: '#/components/parameters/genreIDs'
      - $ref: '#/components/parameters/originIDs'
      - $ref: '#/components/parameters/eraIDs'
      - $ref: '#/components/parameters/artistTypeIDs'
      - $ref: '#/components/parameters/languageIDs'
      - $ref: '#/components/parameters/limit_2'
      - $ref: '#/components/parameters/offset_2'
      - $ref: '#/components/parameters/displayLanguage'
      - $ref: '#/components/parameters/genreList'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta_2'
                  data:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/ArtistObject_2'
                required:
                - meta
                - data
        '400':
          $ref: '#/components/responses/ErrorResponse400_2'
      security:
      - ApiKeyAuth: []
      operationId: getArtistsExplore
      x-operation-id-source: derived
    servers:
    - url: https://api.gmd.music.gracenote.com/v3
components:
  schemas:
    ExternalID:
      type: object
      properties:
        source:
          type: string
        ID:
          type: string
    ArtistObject:
      type:
      - object
      - 'null'
      properties:
        type:
          type: string
          description: its value should be [artists]
        alternateNames:
          description: Only visible to Customers with GMD:Search package and above
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ArtistName'
        artistID:
          description: gracenote ID
          type: string
        href:
          description: will be of the type /artists/gnid?ids=ID
          type: string
        artistName:
          $ref: '#/components/schemas/ArtistName'
        sortName:
          type:
          - string
          - 'null'
        descriptors:
          type:
          - object
          - 'null'
          properties:
            artistTypes:
              $ref: '#/components/schemas/DescriptorObject'
            eras:
              $ref: '#/components/schemas/DescriptorObject'
            genres:
              $ref: '#/components/schemas/DescriptorObject'
            languages:
              $ref: '#/components/schemas/Languages'
            origins:
              $ref: '#/components/schemas/DescriptorObject'
        disambiguation:
          type:
          - string
          - 'null'
          description: Only visible to Customers with GMD:Search package and above
        externalIDs:
          type:
          - array
          - 'null'
          description: Only visible to Customers with Spotify IDs Add on
          items:
            $ref: '#/components/schemas/ExternalID'
        personIDs:
          type:
          - array
          - 'null'
          description: Only visible to Customers with Links to video celebrities Add On
          items:
            nullable: false
            type: string
        images:
          type:
          - array
          - 'null'
          description: Only visible to Customers with Artist Images add-on
          items:
            $ref: '#/components/schemas/Image'
        nameVariants:
          type:
          - array
          - 'null'
          description: Only visible to Customers with GMD:Search package and above
          items:
            type: string
        objectType:
          type:
          - string
          - 'null'
        popularity:
          type:
          - array
          - 'null'
          description: Only visible to Customers with Popularity Add On
          items:
            $ref: '#/components/schemas/Popularity'
        bandMembers:
          type:
          - array
          - 'null'
          description: Only visible to Customers with GMD:Search package and above
          items:
            $ref: '#/components/schemas/ArtistMember'
        collaborationMembers:
          type:
          - array
          - 'null'
          description: Only visible to Customers with GMD:Search package and above
          items:
            $ref: '#/components/schemas/ArtistMember'
        keyArtists:
          type:
          - array
          - 'null'
          description: Only visible to Customers with GMD:Search package and above
          items:
            $ref: '#/components/schemas/Artist'
        memberOfBands:
          type:
          - array
          - 'null'
          description: Only visible to Customers with GMD:Search package and above
          items:
            $ref: '#/components/schemas/Artist'
        memberOfCollaborations:
          type:
          - array
          - 'null'
          description: Only visible to Customers with GMD:Search package and above
          items:
            $ref: '#/components/schemas/Artist'
        similarArtists:
          type:
          - array
          - 'null'
          description: Only visible to Customers with GMD:Advanced Discovery Package
          items:
            $ref: '#/components/schemas/Artist'
    Artist:
      type: object
      properties:
        artistID:
          type:
          - string
          - 'null'
          description: gracenote ID
        artistName:
          type: string
        href:
          type:
          - string
          - 'null'
          description: will be of the type /artists/gnid?ids=GNXX
    ResponseMeta:
      type: object
      nullable: false
      additionalProperties: false
      properties:
        total:
          type: integer
          nullable: false
        count:
          type: integer
          nullable: false
        offset:
          type: integer
          nullable: false
        references:
          type: object
          properties:
            genreCategories:
              type: string
            categoriesLanguage:
              type: string
      required:
      - total
      - count
      - offset
    Image:
      type: object
      properties:
        size:
          type: string
        height:
          type: integer
        width:
          type: integer
        url:
          type: string
          pattern: ^https://
    Popularity:
      type: object
      properties:
        region:
          type: string
        score:
          type: number
        type:
          type: string
    LanguageContext:
      type:
      - object
      - 'null'
      properties:
        language:
          type:
          - string
          - 'null'
        script:
          type:
          - string
          - 'null'
    DescriptorObject:
      type: array
      description: Only visible to Customers with GMD Discovery/Advanced Discovery package.
      items:
        type: object
        properties:
          type:
            type: string
          ID:
            type: string
          name:
            type: string
          weight:
            type: integer
          categories:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                level:
                  type: integer
          links:
            type: object
            properties:
              descriptorCorrelations:
                description: Only visible to Customers with GMD:Advanced Discovery package and above. will be of the type /descriptorCorrelations/{descriptorType}?id=ID
                type: string
    ArtistMember:
      type: object
      properties:
        artistID:
          type:
          - string
          - 'null'
          description: gracenote ID
        artistName:
          type: string
        href:
          type:
          - string
          - 'null'
          description: will be of the type /artists/gnid?ids=GNXX
        ord:
          type: integer
          description: order number for sorting
    ErrorResponse:
      type: object
      nullable: false
      additionalProperties: false
      properties:
        status:
          type: integer
          nullable: false
        error:
          type: string
          nullable: false
        description:
          type: string
          nullable: false
      required:
      - status
      - error
      - description
    ArtistName:
      type: object
      properties:
        artistName:
          type: string
        languageContext:
          $ref: '#/components/schemas/LanguageContext'
    Languages:
      type: array
      description: Only visible to Customers with GMD:Discovery package and above
      items:
        type: object
        properties:
          type:
            type: string
          ID:
            type: string
          name:
            type: string
          weight:
            type: integer
            description: Only visible to Customers with GMD:Advanced Discovery package and above
    ArtistObject_2:
      title: artist object
      nullable: false
      type: object
      additionalProperties: false
      properties:
        objectType:
          type: string
          enum:
          - artist
          description: The object type.
        alternateNames:
          nullable: false
          description: Alternate names include names in different languages and scripts. Only visible to Customers with GMD Search package
          type: array
          items:
            $ref: '#/components/schemas/AlternateNameObject'
        artistID:
          nullable: false
          type: string
          description: Gracenote Artist ID
        artistName:
          $ref: '#/components/schemas/NameObject'
        artistObjectType:
          type:
          - string
          - 'null'
          enum:
          - person
          - group
          - collaboration
          - organization
          - unknown
        descriptors:
          nullable: false
          type: object
          additionalProperties: false
          description: Descriptor data is only returned to Customers with GMD Discovery/Advanced Discovery package.
          properties:
            artistTypes:
              $ref: '#/components/schemas/DescriptorObject_2'
            eras:
              $ref: '#/components/schemas/DescriptorObject_2'
            genres:
              $ref: '#/components/schemas/DescriptorObject_2'
            languages:
              $ref: '#/components/schemas/DescriptorObject_2'
            origins:
              $ref: '#/components/schemas/DescriptorObject_2'
        disambiguation:
          type:
          - string
          - 'null'
          description: A short display string intended to aid in disambiguating similarly named artists. Currently this is in English only and is only visible to Customers with GMD Search package and above
        images:
          nullable: false
          type: array
          description: 'An array of the images for the artist. Returns one classic image with one size (largest available), selected by hierarchy: Preferred > Latest Promotional > Latest In Performance > Latest Red Carpet. Enhanced images (headshot, iconic, backdrop) are included when artist-enhanced-image add-on is present. The first entry is the preferred image. Only visible to Customers with Artist Images add-on'
          items:
            $ref: '#/components/schemas/Image_2'
        nameVariants:
          nullable: false
          type: array
          description: Name Variants can include full name, birth names, misspellings, nicknames, etc. Only visible to Customers with GMD Search package and above.
          items:
            nullable: false
            type: string
        personIDs:
          nullable: false
          type: array
          description: GN TMS Person IDs associated with Artist. Only visible to Customers with Links to GN TMS Person ID Add On
          items:
            nullable: false
            type: string
        popularity:
          $ref: '#/components/schemas/PopularityData'
        popularAlbumEdition:
          $ref: '#/components/schemas/PopularAlbumEditionObject'
        groupMembers:
          nullable: false
          type: array
          description: For `group` artist objects, the artists that are or have been members of the group. Only visible to Customers with GMD Search package and above
          items:
            $ref: '#/components/schemas/ArtistShortWithOrd'
        collaborationMembers:
          nullable: false
          type: array
          description: For `collaboration` artist objects, the artists that are part of the collaboration. Only visible to Customers with GMD Search package and above
          items:
            $ref: '#/components/schemas/ArtistShortWithOrd'
        keyArtists:
          nullable: false
          type: array
          description: For `group` artist objects that have them, this will be the key group members (for example, Prince is the key artist in Prince & The Revolution. if Only visible to Customers with GMD Search package and above
          items:
            $ref: '#/components/schemas/ArtistShort'
        memberOfKeyArtists:
          nullable: false
          type: array
          description: For artists that are or have been a key artist in groups, this will be the list of groups that they were a key artist in. Only visible to Customers with GMD Search package and above
          items:
            $ref: '#/components/schemas/ArtistShort'
        memberOfGroups:
          nullable: false
          type: array
          description: For artists that are or have been members of groups, this will be the list of groups they were members of. Only visible to Customers with GMD Search package and above
          items:
            $ref: '#/components/schemas/ArtistShort'
        memberOfCollaborations:
          nullable: false
          type: array
          description: For artists that are or have been members of collaborations, this will be the list of collaborations they were members of. Only visible to Customers with GMD Search package and above
          items:
            $ref: '#/components/schemas/ArtistShort'
        similarArtists:
          nullable: false
          type: array
          description: Only visible to Customers with GMD Advanced Discovery Package
          items:
            $ref: '#/components/schemas/ArtistShort'
        sortName:
          type:
          - string
          - 'null'
          description: The sortable version of the artist's name.
        submittedArtistID:
          type:
          - string
          - 'null'
          description: The Gracenote Artist ID as submitted in the API request. Populated when a GNID lookup or explore filtered by artistIDs returns this entity. Null for search and non-GNID lookups.
      required:
      - objectType
      - artistID
      - artistName
      - artistObjectType
      - sortName
      examples:
      - "{\n  \"alternateNames\": [\n    {\n      \"artistName\": \"ビートルズ\",\n      \"languageContext\": {\n        \"language\": \"Japanese\",\n        \"script\": \"Katakana\"\n      }\n    },\n    {\n      \"artistName\": \"ザビートルズ\",\n      \"languageContext\": {\n        \"language\": \"Japanese\",\n        \"script\": \"Katakana\"\n      }\n    },\n    {\n      \"artistName\": \"비틀즈\",\n      \"languageContext\": {\n        \"language\": \"Korean\",\n        \"script\": \"Hangul\"\n      }\n    }\n  ],\n  \"artistID\": \"GMGZZX80000006S\",\n  \"artistName\": {\n    \"name\": \"The Beatles\",\n    \"languageContext\": {\n      \"language\": \"English\",\n      \"script\": \"Latin\"\n    }\n  },\n  \"artistObjectType\": \"group\",\n  \"collaborationMembers\": [],\n  \"descriptors\": {\n    \"artistTypes\": [\n      {\n        \"hierarchy\": [\n          {\n            \"level\": 1,\n            \"descriptorID\": \"\",\n            \"label\": \"Male\"\n          },\n          {\n            \"level\": 2,\n            \"descriptorID\": \"\",\n            \"label\": \"Male Group\"\n          },\n          {\n            \"level\": 3,\n            \"descriptorID\": \"2660\",\n            \"label\": \"Male Group - Duo/Group Vocal\"\n          }\n        ],\n        \"type\": \"artistTypes\",\n        \"weight\": 100\n      }\n    ],\n    \"eras\": [\n      {\n        \"hierarchy\": [\n          {\n            \"level\": 1,\n            \"descriptorID\": \"\",\n            \"label\": \"1960s\"\n          },\n          {\n            \"level\": 2,\n            \"descriptorID\": \"2633\",\n            \"label\": \"1960s\"\n          }\n        ],\n        \"type\": \"eras\",\n        \"weight\": 100\n      }\n    ],\n    \"genres\": [\n      {\n        \"hierarchy\": [\n          {\n            \"level\": 1,\n            \"descriptorID\": \"\",\n            \"label\": \"Oldies\"\n          },\n          {\n            \"level\": 2,\n            \"descriptorID\": \"\",\n 