components:
  schemas:
    Catalog:
      title: Catalog represents a conceptual container of programs to be distributed to particular consumers.
      required:
      - name
      type: object
      properties:
        languages:
          type: array
          description: Languages of Presentations which this Catalog holds. Must conform to GNVocab languages.
          items:
            type: string
        markets:
          type: array
          description: Applicable Markets that this Catalog represents. Must conform to GNVocab countries.
          items:
            type: string
        name:
          minLength: 1
          type: string
          description: 'The name of this Catalog. Must be unique to other Catalog''s

            which the Source manages.'
        tags:
          type: array
          description: Optional keyword tags to describe the contents of the Catalog.
          items:
            type: string
        gnID:
          type: string
          description: The Gracenote ID of the Catalog.
          readOnly: true
        presentationCount:
          type: integer
          description: 'Deprecated: The total number of presentations associated with this catalog.

            This field is deprecated and always returns 0.'
          format: int64
          readOnly: true
        updated:
          type: string
          description: When the Catalog was last updated.
          readOnly: true
      description: 'NewCatalog contains information required for creating (POST)

        or updating (PUT) a Catalog.'
    DeletedCatalog:
      type: object
      properties:
        gnID:
          type: string
          description: The Gracenote ID of the deleted catalog.
          examples:
          - GNLZZXZ00000000
      description: DeletedCatalog represents a deleted Catalog
    CatalogsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    CatalogResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Catalog'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    DeletedCatalogProgramMappingsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProgram'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    NewCatalog:
      required:
      - name
      type: object
      properties:
        languages:
          type: array
          description: Languages of Presentations which this Catalog holds. Must conform to GNVocab languages.
          items:
            type: string
        markets:
          type: array
          description: Applicable Markets that this Catalog represents. Must conform to GNVocab countries.
          items:
            type: string
        name:
          minLength: 1
          type: string
          description: 'The name of this Catalog. Must be unique to other Catalog''s

            which the Source manages.'
        tags:
          type: array
          description: Optional keyword tags to describe the contents of the Catalog.
          items:
            type: string
      description: 'NewCatalog contains information required for creating (POST)

        or updating (PUT) a Catalog.'
    DeletedCatalogResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeletedCatalog'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    AddProgramsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProgram'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    MetaResponse:
      required:
      - rayID
      type: object
      properties:
        count:
          type: integer
          description: Count is the number of records included a Data field.
          format: int64
        limit:
          type: integer
          description: Limit is the maximum requested number of objects returned by the request.
          format: int64
        page:
          type: integer
          description: Page is the page number containing the objects in the response.
          format: int64
        rayID:
          type: string
          description: 'RayID is the backend id of the request, generated at invocation time.

            Any questions or bug reports about a particular invocation should include the returned RequestID.'
        total:
          type: integer
          description: Total is the total number of hits on a query before pagination.
          format: int64
      description: MetaResponse describes response data
    CatalogProgram:
      required:
      - catalogGnID
      - presentationGnID
      type: object
      properties:
        catalogGnID:
          type: string
          description: The gnID of the Catalog.
        presentationGnID:
          type: string
          description: The gnID of the presentation being added.
        updated:
          type: string
          description: When the Catalog program mapping was last updated.
          readOnly: true
      description: 'CatalogProgram contains information required for adding (POST)

        programs to a Catalog.'
  parameters:
    apiKeyParam:
      name: GN-APIKEY
      in: header
      description: API key to authorize the request.
      required: true
      schema:
        type: string
        examples:
        - your-api-key
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: GN-APIKEY
      description: API key to authorize the request. Click Authorize and paste the key created for your application.
