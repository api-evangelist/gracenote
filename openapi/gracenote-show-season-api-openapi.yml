components:
  schemas:
    Cast:
      description: Cast is an individual who performed in a production
      required:
      - name
      - order
      - role
      type: object
      properties:
        aka:
          $ref: '#/components/schemas/Name'
        name:
          $ref: '#/components/schemas/Name'
        order:
          minimum: 1
          type: integer
          description: 'Order in which the cast member appears on the billing. Must be unique

            per program and cannot be negative or zero.'
          format: int64
          examples:
          - 1
        character:
          type: string
          description: Character is the name of the cast member's portrayed character.
        role:
          type: string
          description: 'Role defines the cast member''s credited contribution.

            Defined by the Gracenote Vocabulary.'
    ExternalID:
      required:
      - id
      - isPrimary
      type: object
      properties:
        id:
          type: string
          description: id is the external identifier.
        isPrimary:
          type: boolean
          description: 'indicates that the external ID is the primary ID

            used to identify the program external to Gracenote.

            Exactly one primary external ID is allowed (and required) per program.'
        isProvider:
          type: boolean
          description: 'indicates that the source provider uses this ID as

            their internal ID for the program. Exactly one provider

            external ID is allowed per program.'
        label:
          type: string
          description: label is a tag to describe the identifier.
      description: ExternalID is an external (to Gracenote) identifier of the program
    Season:
      description: 'Season represents a grouping of

        Show episodes'
      type: object
      properties:
        cast:
          type: array
          description: 'The cast of the season.


            Each cast''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Cast'
        crew:
          type: array
          description: 'The crew of the season.


            Each crew''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Crew'
        descriptions:
          type: array
          description: A list of descriptions for the season.
          items:
            $ref: '#/components/schemas/Description'
        externalIDs:
          $ref: '#/components/schemas/ExternalIDs'
        finaleDate:
          type: string
          description: The date on which the season ends with the season's finale.
          format: date
        nonSeason:
          type: boolean
          description: Indicates that the season is a one-off occurrence and is non-repetitive. Mutually exclusive with SeasonNumber.
        ordinal:
          type: integer
          description: The order of which the season appears
          format: int64
        originalSource:
          type: string
          description: 'The original source of the season (or network if

            the season originated on a network).'
          examples:
          - Lifetime
        releaseDate:
          type: string
          description: The date the season was release
          format: date
        seasonNumber:
          type: string
          description: Indicates which season of a show the season is.
        title:
          $ref: '#/components/schemas/Title'
        subType:
          type: string
          description: The high-level type of the program.
          examples:
          - series
        type:
          type: string
          description: The high-level type of the program.
          readOnly: true
          examples:
          - show
        episodeGnIDs:
          type: array
          description: The episode gnIDs which are children of the season.
          readOnly: true
          items:
            type: string
        gnID:
          type: string
          description: The Gracenote ID of the season.
          readOnly: true
        showPresentationGnID:
          type: string
          description: The show presentation GnID that is a parent of the Season.
          readOnly: true
        sourceId:
          type: string
          description: The internal Source ID associated with the program.
          readOnly: true
        updated:
          type: string
          description: The time the program was last updated.
          readOnly: true
      required:
      - subType
    DeletedEpisode:
      type: object
      properties:
        gnID:
          type: string
          description: The Gracenote ID of the deleted program.
          readOnly: true
          examples:
          - GNLZZXZ00000001
        seasonGnID:
          type: string
          description: The Gracenote ID of the episode's parent season.
      description: DeletedEpisode reports the gnID of an episode and its parent Season
    Description:
      required:
      - language
      - length
      - value
      type: object
      properties:
        language:
          type: string
          description: 'Language of the description''s text. User must be entitled to use the language.

            See the Gracenote Vocabulary for valid languages.'
        length:
          type: integer
          description: 'Length defines the maximum number of characters that can be used in a description.

            The value of the description must be less than or equal to the specified length from values 1 to 1000.'
          format: int64
        value:
          type: string
          description: Value is the raw text description of a program.
      description: Description is a set of fields that describe a program
    DeletedShowSeason:
      type: object
      properties:
        episodes:
          type: array
          description: The deleted episodes that belong to the deleted show season.
          items:
            $ref: '#/components/schemas/DeletedEpisode'
        gnID:
          type: string
          description: The Gracenote ID of the deleted season.
          readOnly: true
          examples:
          - GNLZZXV00000001
        showPresentationGnID:
          type: string
          description: The ID of the season's parent presentation.
      description: 'DeletedSeason contains the ID of the deleted Season as well as

        the parent and child IDs of the Season.'
    SeasonResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Season'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    ExternalIDs:
      type: array
      description: ExternalIDs is a convenience alias on a slice of ExternalID types
      items:
        $ref: '#/components/schemas/ExternalID'
    DeletedShowSeasonResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeletedShowSeason'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    Crew:
      description: 'Crew is a member who was part of

        a program''s production crew.'
      required:
      - name
      - order
      - type
      type: object
      properties:
        aka:
          $ref: '#/components/schemas/Name'
        name:
          $ref: '#/components/schemas/Name'
        order:
          minimum: 1
          type: integer
          description: 'Order in which the cast member appears on the billing. Must be unique

            per program and cannot be negative or zero.'
          format: int64
          examples:
          - 1
        type:
          type: string
          description: 'Type describes the role or "crew type" of the crew member.

            Defined by the Gracenote Vocabulary.'
    UpdateSeason:
      type: object
      properties:
        cast:
          type: array
          description: 'The cast of the season.


            Each cast''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Cast'
        crew:
          type: array
          description: 'The crew of the season.


            Each crew''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Crew'
        descriptions:
          type: array
          description: A list of descriptions for the season.
          items:
            $ref: '#/components/schemas/Description'
        externalIDs:
          $ref: '#/components/schemas/ExternalIDs'
        finaleDate:
          type: string
          description: The date on which the season ends with the season's finale.
          format: date
        nonSeason:
          type: boolean
          description: Indicates that the season is a one-off occurrence and is non-repetitive. Mutually exclusive with SeasonNumber.
        ordinal:
          type: integer
          description: The order of which the season appears
          format: int64
        originalSource:
          type: string
          description: 'The original source of the season (or network if

            the season originated on a network).'
          examples:
          - Lifetime
