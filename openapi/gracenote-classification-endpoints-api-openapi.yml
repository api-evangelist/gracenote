openapi: 3.2.0
info:
  title: Global Sports Data Lookup API v1 … Classification Endpoints…
  description: This page contains all Lookup API endpoints that are part of our Core Sports Data.
  version: '1'
servers:
- url: /proxy/sports
tags:
- name: Classification Endpoints
paths:
  /gsd/lookup/v1/classifications/{classificationId}:
    get:
      tags:
      - Classification Endpoints
      summary: Classification Info
      operationId: ClassificationInfo
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: classificationId
        in: path
        required: true
        schema:
          type: string
          default: GS0005T000WhPtr
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/classifications/{classificationId}/results:
    get:
      tags:
      - Classification Endpoints
      summary: Results by Classification
      operationId: ResultsbyClassification
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: classificationId
        in: path
        required: true
        schema:
          type: string
          default: GS0005T000WhPtr
      - name: skip
        in: query
        required: false
        description: Skip this number of elements in the response. If provided, it must be a non-negative integer and it must be provided together with the limit parameter.
        schema:
          type: string
          default: ''
      - name: limit
        in: query
        required: false
        description: Limit for the number of elements in the response. If provided, it must be a positive integer and it must be provided together with the skip parameter.
        schema:
          type: string
          default: ''
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
components:
  parameters:
    AcceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        enum:
        - application/json
        default: application/json
    ApiKeyQuery:
      name: api_key
      in: query
      required: true
      description: API key for authentication
      schema:
        type: string
    LanguageQuery:
      name: language
      in: query
      description: Language Code which will translate all translatable fields into the requested language.
      schema:
        type: string
        enum:
        - ''
        - ar-SA
        - cs-CZ
        - da-DK
        - de-DE
        - el-GR
        - en-GB
        - en-US
        - es-ES
        - fi-FI
        - fr-FR
        - hu-HU
        - it-IT
        - ja-JP
        - ko-KR
        - nb-NO
        - nl-BE
        - nl-NL
        - pl-PL
        - pt-BR
        - pt-PT
        - ro-RO
        - ru-RU
        - sv-SE
        - tr-TR
        - zh-CN
        - zh-HK
        default: en-GB
