openapi: 3.2.0
info:
  title: Global Sports Data Lookup API v1 Series Endpoints API
  description: This page contains all Lookup API endpoints that are part of our Core Sports Data.
  version: '1'
servers:
- url: /proxy/sports
tags:
- name: Series Endpoints
paths:
  /gsd/lookup/v1/series/{seriesId}:
    get:
      tags:
      - Series Endpoints
      summary: Series Info
      operationId: SeriesInfo
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: seriesId
        in: path
        required: true
        schema:
          type: string
          default: GN87DRG1TQJXGNH
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/series/{seriesId}/league-overview:
    get:
      tags:
      - Series Endpoints
      summary: League Overview by Series
      operationId: LeagueOverviewbySeries
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: seriesId
        in: path
        required: true
        schema:
          type: string
          default: GN87DRG1TQJXGNH
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/series/{seriesId}/series-seasons:
    get:
      tags:
      - Series Endpoints
      summary: Series Seasons by Series
      operationId: SeriesSeasonsbySeries
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: seriesId
        in: path
        required: true
        schema:
          type: string
          default: GN87DRG1TQJXGNH
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
components:
  parameters:
    AcceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        enum:
        - application/json
        default: application/json
    ApiKeyQuery:
      name: api_key
      in: query
      required: true
      description: API key for authentication
      schema:
        type: string
    LanguageQuery:
      name: language
      in: query
      description: Language Code which will translate all translatable fields into the requested language.
      schema:
        type: string
        enum:
        - ''
        - ar-SA
        - cs-CZ
        - da-DK
        - de-DE
        - el-GR
        - en-GB
        - en-US
        - es-ES
        - fi-FI
        - fr-FR
        - hu-HU
        - it-IT
        - ja-JP
        - ko-KR
        - nb-NO
        - nl-BE
        - nl-NL
        - pl-PL
        - pt-BR
        - pt-PT
        - ro-RO
        - ru-RU
        - sv-SE
        - tr-TR
        - zh-CN
        - zh-HK
        default: en-GB
