openapi: 3.2.0
info:
  title: GN IDS API v1.9.3 Export API
  description: 'The purpose of this application is to provide an API to create, retrieve, update, delete,

    and publish client programs.'
  version: 1.9.3
servers:
- url: /proxy/gnids/api/v1
tags:
- name: Export
paths:
  /bulk/programs/exports:
    get:
      tags:
      - Export
      summary: Returns a paginated collection of exports in a source's catalog
      description: it provides information for all exports to a source with current export statuses
      operationId: getExports
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
      - name: limit
        in: query
        required: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int64
      - name: page
        in: query
        required: true
        schema:
          minimum: 1
          type: integer
          format: int64
      - name: sortField
        in: query
        description: Field by which to sort batches by.
        schema:
          type: string
          default: updated
          enum:
          - created
          - updated
      - name: sortDirection
        in: query
        description: Direction by which to sort the search results.
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - asc
          - DESC
          - desc
      responses:
        '200':
          description: ExportsResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportsResponse'
        '400':
          description: BadRequestError
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
                    examples:
                    - request body must not be empty
                  error:
                    type: string
                    examples:
                    - bad_request
                  instance:
                    type: string
                    examples:
                    - /api/v1/shows
                  meta:
                    type: object
                    properties:
                      rayID:
                        type: string
                        examples:
                        - 52fdfc07-2182-454f-963f-5f0f9a621d72
                  status:
                    type: integer
                    format: int64
                    examples:
                    - 400
        '401':
          description: UnauthorizedError
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
                    examples:
                    - authentication failed
                  error:
                    type: string
                    examples:
                    - unauthorized
                  instance:
                    type: string
                    examples:
                    - /api/v1/shows
                  meta:
                    type: object
                    properties:
