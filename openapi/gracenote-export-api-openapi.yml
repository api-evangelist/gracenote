        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
                    examples:
                    - internal server error
                  error:
                    type: string
                    examples:
                    - internal_server_error
                  instance:
                    type: string
                    examples:
                    - /api/v1/shows
                  meta:
                    type: object
                    properties:
                      rayID:
                        type: string
                        examples:
                        - 52fdfc07-2182-454f-963f-5f0f9a621d72
                  status:
                    type: integer
                    format: int64
                    examples:
                    - 500
        '598':
          description: RequestReadTimeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
                    examples:
                    - request read timed out
                  error:
                    type: string
                    examples:
                    - request_read_timeout
                  instance:
                    type: string
                    examples:
                    - /api/v1/bulk/movies/batches
                  meta:
                    type: object
                    properties:
                      rayID:
                        type: string
                        examples:
                        - 52fdfc07-2182-454f-963f-5f0f9a621d72
                  status:
                    type: integer
                    format: int64
                    examples:
                    - 598
      security:
      - api_key: []
      x-codegen-request-body-name: newExport
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
  /bulk/programs/exports/{gnID}:
    get:
      tags:
      - Export
      description: Fetches an export by its GNID
      operationId: getExportByGnID
      responses:
        '200':
          description: ExportResponse
          content:
            application/json:
              schema:
