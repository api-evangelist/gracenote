note: >-
  Provenance for the ten first-party Gracenote OpenAPI definitions saved in this directory.
  Gracenote's new developer portal (devportal.gracenote.com, announced on the legacy
  developer.tmsapi.com gateway as the replacement surface as of 2026-09-08) is built on Zudoku.
  Zudoku does not serve the raw .json/.yaml spec files at a public path — it ships each catalog
  entry as a pre-processed ES module under /assets/. Those modules are public, unauthenticated,
  and are the exact spec content the portal renders. Each file below was fetched from the URL in
  `fetched_from`, the module's exported `schema` object was evaluated, and the JSON Pointers the
  bundler had inlined (carried on a non-enumerable `__$ref` property) were restored to `$ref`
  form. No content was added, removed, rewritten, or invented. `servers[]` is preserved exactly as
  published — for most entries that is the portal's own API-Explorer proxy path (e.g. /proxy/gvd),
  NOT a callable host, so the real production base URL for each API is recorded on the matching
  apis[].baseURL in apis.yml and sourced from the product documentation page named in `base_source`.
ownership_check: >-
  Every spec identifies itself as Gracenote: info.title carries the Gracenote product name (On API,
  GVD API, GMD API, GN IDS API, Nexus API, OnConnect Lookup APIs, Global Sports Data), the GMD v3
  spec declares servers[0].url https://api.gmd.music.gracenote.com/v3, and the Nexus spec declares
  info.contact.email nexusengineering@nielsen.com — Gracenote is the content data business unit of
  Nielsen, which the company states on its own site. All are served from gracenote.com hosts.
