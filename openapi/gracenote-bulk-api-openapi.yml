            type: string
          examples:
          - - CA
        productionStatus:
          type: string
          description: Describes the production status of the movie.
          examples:
          - completed
        ratings:
          type: array
          description: The ratings for this presentation.
          items:
            $ref: '#/components/schemas/Rating'
          examples:
          - - advisories:
              - contains strong language
              rating: PG-13
              ratingBody: MPAA
        releaseDate:
          type: string
          description: 'The date on which the movie was released.


            ReleaseDate is optional for creating a presentation, but

            either ReleaseYear or ReleaseDate is required for publishing.

            Either ReleaseYear or ReleaseDate must be specified for update when the presentation is

            in publishing/published state.'
          format: date
        releaseYear:
          type: integer
          description: 'The year in which the movie was released.


            ReleaseYear is optional for creating a presentation, but

            either ReleaseYear or ReleaseDate is required for publishing.

            Either ReleaseYear or ReleaseDate must be specified for update when the presentation is

            in publishing/published state.'
          format: int64
          examples:
          - 2000
        targetAudience:
          type: string
          description: The primary demographic that the program is targeted towards.
          examples:
          - children
        title:
          $ref: '#/components/schemas/Title'
        subType:
          type: string
          description: The high-level type of the program.
          examples:
          - featureFilm
        type:
          type: string
          description: The high-level type of the program.
          readOnly: true
          examples:
          - movie
    NewSeason:
      description: NewSeason represents the fields required for creating a season of a show
      type: object
      properties:
        cast:
          type: array
          description: 'The cast of the season.


            Each cast''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Cast'
        crew:
          type: array
          description: 'The crew of the season.


            Each crew''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Crew'
        descriptions:
          type: array
          description: A list of descriptions for the season.
          items:
            $ref: '#/components/schemas/Description'
        externalIDs:
          $ref: '#/components/schemas/ExternalIDs'
        finaleDate:
          type: string
          description: The date on which the season ends with the season's finale.
          format: date
        nonSeason:
          type: boolean
          description: Indicates that the season is a one-off occurrence and is non-repetitive. Mutually exclusive with SeasonNumber.
        ordinal:
          type: integer
          description: The order of which the season appears
          format: int64
        originalSource:
          type: string
          description: 'The original source of the season (or network if

            the season originated on a network).'
          examples:
          - Lifetime
        releaseDate:
          type: string
          description: The date the season was release
          format: date
        seasonNumber:
          type: string
          description: Indicates which season of a show the season is.
        title:
          $ref: '#/components/schemas/Title'
        subType:
          type: string
          description: The high-level type of the program.
          examples:
          - series
        type:
          type: string
          description: The high-level type of the program.
          readOnly: true
          examples:
          - show
      required:
      - subType
    ShowParentVersionPayload:
      type: object
      properties:
        context:
          $ref: '#/components/schemas/Context'
        presentations:
          type: array
          items:
            $ref: '#/components/schemas/ShowPresentationPayload'
        rootGnID:
          type: string
          description: The Gracenote ID of the root that the version belongs to
        version:
          $ref: '#/components/schemas/NewShowVersion'
    MappingInfo:
      type: object
      properties:
        id:
          type: string
          description: 'ID contains the tmsID that the presentation is mapped to.

            This can be either user-provided ID or a gracenote mapped ID.'
        origin:
          type: string
          description: 'The possible values fr origin are sourceProvided and gracenote.

            If the user-provided TmsID is used, the origin is sourceProvided.

            If a gracenote provided TmsID is used, or if gracenote replaces the

            user-provided TmsID, gracenote is used.'
        type:
          type: string
          description: 'Type describes the type of ID that was used for mapping the presentation.

            Currently, only tmsID is supported.'
      description: 'MappingInfo contains information about how the

        TmsID was determined for the presentation.'
  parameters:
    apiKeyParam:
      name: GN-APIKEY
      in: header
      description: API key to authorize the request.
      required: true
      schema:
        type: string
        examples:
        - your-api-key
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: GN-APIKEY
      description: API key to authorize the request. Click Authorize and paste the key created for your application.
