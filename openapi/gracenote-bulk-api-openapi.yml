components:
  schemas:
    NewShowPresentation:
      description: NewPresentation represents the fields required for creating a presentation of a show
      required:
      - title
      - subType
      type: object
      properties:
        cast:
          type: array
          description: 'The cast of the presentation.


            Each cast''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Cast'
        crew:
          type: array
          description: 'The crew of the presentation.


            Each crew''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Crew'
        descriptions:
          $ref: '#/components/schemas/Descriptions'
        externalIDs:
          $ref: '#/components/schemas/ExternalIDs'
        finaleDate:
          type: string
          description: The date at which the series ends with a series finale.
          format: date
        genres:
          type: array
          description: 'The applicable genres to the presentation.


            Genres are not required for creating a presentation,

            but at least one is required for publishing.

            Genres is required for update when the presentation is

            in publishing/published state.'
          items:
            type: string
          examples:
          - - Fantasy
            - Adventure
        originalSource:
          type: string
          description: 'The original source of the program (or network if

            the program originated on a network).'
          examples:
          - Lifetime
        presentationLabels:
          type: array
          description: 'Describes content information and/or contextual business tags to describe

            the intent of the presentation.'
          items:
            type: string
          examples:
          - - UK EN
            - US EN
        productionCompanies:
          type: array
          description: Any companies that have contributed in the production of the program.
          items:
            type: string
          examples:
          - - Newline
        productionCountries:
          type: array
          description: 'Any countries that the program was produced in.

            See the Gracenote Vocabulary for valid country codes.'
          items:
            type: string
          examples:
          - - CA
        ratings:
          type: array
          description: The ratings for this presentation.
          items:
            $ref: '#/components/schemas/Rating'
          examples:
          - - advisories:
              - contains strong language
              rating: PG-13
              ratingBody: MPAA
        releaseDate:
          type: string
