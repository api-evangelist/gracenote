components:
  schemas:
    NewMovieRoot:
      title: NewRoot represents the fields required for creating a root of a movie.
      required:
      - title
      - subType
      type: object
      properties:
        title:
          $ref: '#/components/schemas/Title'
        subType:
          type: string
          description: The high-level type of the program.
          examples:
          - featureFilm
        type:
          type: string
          description: The high-level type of the program.
          readOnly: true
          examples:
          - movie
    MovieRootResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MovieRoot'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    Title:
      required:
      - language
      - value
      type: object
      properties:
        language:
          type: string
          description: 'The language of the title''s text. User must be entitled to use the language.

            See the Gracenote Vocabulary for valid languages.'
        value:
          type: string
          description: The text of the title.
      description: 'Title holds information about

        a program''s title.'
    UpdateMovieRoot:
      title: UpdateRoot represents the fields required for updating a root of a movie.
      required:
      - title
      type: object
      properties:
        title:
          $ref: '#/components/schemas/Title'
    MovieRoot:
      title: Root represents the root of a movie.
      required:
      - title
      - subType
      type: object
      properties:
        title:
          $ref: '#/components/schemas/Title'
        subType:
          type: string
          description: The high-level type of the program.
          examples:
          - featureFilm
        type:
          type: string
          description: The high-level type of the program.
          readOnly: true
          examples:
          - movie
        gnID:
          type: string
          description: The Gracenote ID of the program.
          readOnly: true
        sourceId:
          type: string
          description: The internal Source ID associated with the program.
          readOnly: true
        updated:
          type: string
          description: The time the program was last updated
          readOnly: true
        versionGnIDs:
          type: array
          description: The set of child version GnIDs of the root
          readOnly: true
          items:
            type: string
    DeletedMovieRoot:
      description: DeletedRoot represents the root of a deleted movie
      type: object
      properties:
        gnID:
          type: string
          description: The Gracenote ID of the deleted program.
          readOnly: true
          examples:
          - GNLZZXZ00000000
        versions:
          type: array
          description: The Gracenote ID of the deleted program versions.
          items:
            $ref: '#/components/schemas/DeletedVersion'
          examples:
          - - GNLZZXZ00000000
    DeletedMovieRootResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeletedMovieRoot'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    MetaResponse:
      required:
      - rayID
      type: object
      properties:
        count:
          type: integer
          description: Count is the number of records included a Data field.
          format: int64
        limit:
          type: integer
          description: Limit is the maximum requested number of objects returned by the request.
          format: int64
        page:
          type: integer
          description: Page is the page number containing the objects in the response.
          format: int64
        rayID:
          type: string
          description: 'RayID is the backend id of the request, generated at invocation time.

            Any questions or bug reports about a particular invocation should include the returned RequestID.'
        total:
          type: integer
          description: Total is the total number of hits on a query before pagination.
          format: int64
      description: MetaResponse describes response data
    DeletedVersion:
      description: DeletedVersion represents the version of a deleted entity
      type: object
      properties:
        gnID:
          type: string
          description: The Gracenote ID of the deleted program.
          readOnly: true
          examples:
          - GNLZZXZ00000000
        rootGnID:
          type: string
          description: The GnID of the version's parent root.
          examples:
          - GNLZZZ300000000
  parameters:
    apiKeyParam:
      name: GN-APIKEY
      in: header
      description: API key to authorize the request.
      required: true
      schema:
        type: string
        examples:
        - your-api-key
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: GN-APIKEY
      description: API key to authorize the request. Click Authorize and paste the key created for your application.
