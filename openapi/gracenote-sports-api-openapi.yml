openapi: 3.2.0
info:
  title: Gracenote Sports API
  version: '1.0'
  description: 'Operations tagged Sports across 3 of this provider''s published API definitions: gracenote-onconnect-lookup-apis-openapi.json, gracenote-openapi.yml, gracenote-sports-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /proxy/onconnect
- url: http://data.tmsapi.com/v1.1
  description: Gracenote OnConnect (data_v1_1)
- url: /proxy/nexus/v1
tags:
- name: Sports
paths:
  /v1.1/sports/{sportsId}/events/airings:
    get:
      summary: Airings of Sports Events
      description: Returns live sports events and associated metadata for a list of sports that are airing on a lineup for a given time period up to 24 hours in length and up to 14 days in advance.
      tags:
      - Sports
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - name: sportsId
        in: path
        required: true
        schema:
          type: string
          default: 58,59
        description: A comma-separated list of sports genre ids (e.g., 58 for baseball, 59 for basketball) or 'all' to return airings for all sports.
      - name: lineupId
        in: query
        required: true
        schema:
          type: string
          default: USA-TX42500-X
        description: Lineup ID
      - name: startDateTime
        in: query
        required: true
        schema:
          type: dateTime
          default: ''
        description: Date/Time to start from (ISO 8601).
      - name: endDateTime
        in: query
        required: false
        schema:
          type: dateTime
          default: ''
        description: Date/Time to end on (ISO 8601). Defaults to startDateTime plus three hours.
      - name: liveOnly
        in: query
        required: false
        schema:
          type: boolean
          default: ''
          enum:
          - ''
          - 'true'
          - 'false'
        description: Boolean indicating whether to only include live events. Defaults to false.
      - name: imageSize
        in: query
        required: false
        schema:
          type: string
          default: ''
          enum:
          - ''
          - Sm
          - Md
          - Lg
          - Ms
        description: Size of the image referenced by the preferred image URI returned. The default value is Md (medium)
      - name: imageAspectTV
        in: query
        required: false
        schema:
          type: string
          default: ''
          enum:
          - ''
          - 2x3
          - 3x4
          - 4x3
          - 16x9
        description: Aspect ratio of the image referenced by the preferred image URI returned. Only applies to TV content. The default value is 2x3.
      responses:
        '200':
          description: Successful response
      operationId: getV11SportsBySportsIdEventsAirings
      x-operation-id-source: derived
    servers:
    - url: /proxy/onconnect
  /v1.1/sports/{sportsId}:
    get:
      summary: Sports with Optional Organizations
      description: Returns all (or specified) sports with associated organizations.
      tags:
      - Sports
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - name: sportsId
        in: path
        required: true
        schema:
          type: string
          default: all
        description: A comma-separated list of sports genre ids (e.g., "59" for Basketball) or 'all' for all sports.
      - name: includeOrg
        in: query
        required: false
        schema:
          type: boolean
          default: ''
          enum:
          - ''
          - 'true'
          - 'false'
        description: Boolean indicating whether to include organization metadata. Defaults to false.
      - name: officialOrg
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
          enum:
          - ''
          - 'true'
          - 'false'
        description: If true, results are filtered to include only official organizations.  Defaults to false.
      - name: imageSize
        in: query
        required: false
        schema:
          type: string
          default: ''
          enum:
          - ''
          - Sm
          - Md
          - Lg
          - Ms
        description: Size of the image referenced by the preferred image URI returned. The default value is Md (medium)
      responses:
        '200':
          description: Successful response
      operationId: getV11SportsBySportsId
      x-operation-id-source: derived
    servers:
    - url: /proxy/onconnect
  /v1.1/sports/{sportsId}/non-events/airings:
    get:
      summary: Airings of Sports Non-Events
      description: Returns sports non-events (talk shows) and taped events (classic games, early morning replays, etc.) for a list of sports that are airing on a lineup for a given time period up to 24 hours in length and up to 14 days in advance.
      tags:
      - Sports
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - name: sportsId
        in: path
        required: true
        schema:
          type: string
          default: 58,59
        description: A comma-separated list of sports genre ids (e.g., 58 for baseball, 59 for basketball) or 'all' to return airings for all sports.
      - name: lineupId
        in: query
        required: true
        schema:
          type: string
          default: USA-TX42500-X
        description: Lineup ID
      - name: startDateTime
        in: query
        required: true
        schema:
          type: dateTime
          default: ''
        description: Date/Time to start from (ISO 8601).
      - name: endDateTime
        in: query
        required: false
        schema:
          type: dateTime
          default: ''
        description: Date/Time to end on (ISO 8601). Defaults to startDateTime plus three hours.
      - name: imageSize
        in: query
        required: false
        schema:
          type: string
          default: ''
          enum:
          - ''
          - Sm
          - Md
          - Lg
          - Ms
        description: Size of the image referenced by the preferred image URI returned. The default value is Md (medium)
      - name: imageAspectTV
        in: query
        required: false
        schema:
          type: string
          default: ''
          enum:
          - ''
          - 2x3
          - 3x4
          - 4x3
          - 16x9
        description: Aspect ratio of the image referenced by the preferred image URI returned. Only applies to TV content. The default value is 2x3.
      responses:
        '200':
          description: Successful response
      operationId: getV11SportsBySportsIdNonEventsAirings
      x-operation-id-source: derived
    servers:
    - url: /proxy/onconnect
  /v1.1/sports/universities:
    get:
      summary: All Universities
      description: Returns a list of all universities.
      tags:
