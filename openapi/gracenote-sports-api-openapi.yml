  /sports:
    get:
      tags:
      - Sports
      summary: Search sports content
      operationId: searchSports
      parameters:
      - in: query
        name: sportName
        schema:
          type: string
      - in: query
        name: teamName
        schema:
          type: string
      responses:
        '200':
          description: Sports
      security:
      - apiKey: []
    servers:
    - url: http://data.tmsapi.com/v1.1
      description: Gracenote OnConnect (data_v1_1)
  /sports/{sportId}:
    get:
      tags:
