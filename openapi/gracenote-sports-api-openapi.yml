      - name: universityId
        in: path
        required: true
        schema:
          type: string
          default: '1'
        description: A comma-separated list of university IDs, or 'all' for entire list of universities and teams.
      - name: includeTeam
        in: query
        required: false
        schema:
          type: boolean
          default: 'true'
          enum:
          - ''
          - 'true'
          - 'false'
        description: Boolean indicating whether to include organization metadata. Defaults to false.
      - name: imageSize
        in: query
        required: false
        schema:
          type: string
          default: ''
          enum:
          - ''
          - Sm
          - Md
          - Lg
          - Ms
        description: Size of the image referenced by the preferred image URI returned. The default value is Md (medium)
      responses:
        '200':
          description: Successful response
      operationId: getV11SportsUniversitiesByUniversityId
      x-operation-id-source: derived
    servers:
    - url: /proxy/onconnect
  /v1.1/sports/teams/{teamBrandId}:
    get:
      summary: Team Details
      description: Returns details for a specified team. *Available with R&D/Commercial plans only.
