openapi: 3.1.0
info:
  title: Gracenote OnConnect TMS Celebrities Sports API
  description: 'Best-effort OpenAPI 3.1 for the Gracenote (TMS) OnConnect data_v1_1 API. Read-only entertainment data: lineups, stations, schedules, programs, series, movies, sports, and celebrities. Authentication is via API key as the `api_key` query parameter.'
  version: '1.1'
servers:
- url: http://data.tmsapi.com/v1.1
  description: Gracenote OnConnect (data_v1_1)
security:
- apiKey: []
tags:
- name: Sports
paths:
  /sports:
    get:
      tags:
      - Sports
      summary: Search sports content
      operationId: searchSports
      parameters:
      - in: query
        name: sportName
        schema:
          type: string
      - in: query
        name: teamName
        schema:
          type: string
      responses:
        '200':
          description: Sports
  /sports/{sportId}:
    get:
      tags:
      - Sports
      summary: Get sport / event details
      operationId: getSport
      parameters:
      - in: path
        name: sportId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sport
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: api_key
