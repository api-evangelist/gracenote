          - Md
          - Lg
          - Ms
        description: Size of the image referenced by the preferred image URI returned. The default value is Md (medium)
      responses:
        '200':
          description: Successful response
      operationId: getV11SportsTeamsByTeamBrandId
      x-operation-id-source: derived
    servers:
    - url: /proxy/onconnect
  /v1.1/sports/teams/{teamBrandId}/airings:
    get:
      summary: Team Airings
      description: Returns airings for specified teams. *Available with R&D/Commercial plans only.
      tags:
      - Sports
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - name: teamBrandId
        in: path
