        schema:
          type: dateTime
          default: ''
        description: Date/Time to end on (ISO 8601). Defaults to startDateTime plus three hours.
      - name: includeDetail
        in: query
        required: false
        schema:
          type: boolean
          default: 'true'
          enum:
          - ''
          - 'true'
          - 'false'
        description: Boolean indicating whether to include detailed program metadata with each airing. Defaults to false.
      - name: imageSize
        in: query
        required: false
        schema:
          type: string
          default: ''
          enum:
          - ''
          - Sm
          - Md
          - Lg
          - Ms
