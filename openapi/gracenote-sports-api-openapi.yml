components:
  parameters:
    ApiKeyQuery:
      name: api_key
      in: query
      required: true
      schema:
        type: string
      description: API key for authentication
    topParam:
      name: topOnly
      in: query
      required: false
      description: A boolean parameter to filter leagues. When set to `true`, only the most popular leagues for the specified content market are returned. The content is subject to the entitlements associated with the provided apiKey.
      schema:
        type: boolean
    contentMarketParam:
      in: query
      name: contentMarket
      description: The market for the content. This parameter is used to tailor the content based on the target market as set by the manufacturer.
      required: true
      schema:
        type: string
        enum:
        - AUS
        - CAN
        - DEU
        - ESP
        - FRA
        - GBR
        - IND
        - ITA
        - JPN
        - KOR
        - USA
      examples:
        default:
          value: USA
    encodingParam:
      description: Optional header to specify the encoding type that the client is hoping to receive.
      name: Accept-Encoding
      in: header
      required: false
      schema:
        type: string
        examples:
        - gzip
    apiKeyParam:
      name: GN-APIKEY
      in: header
      description: API key to authorize the request.
      required: true
      schema:
        type: string
        examples:
        - your-api-key
    statusParam:
      in: query
      name: status
      description: A filter that indicates the status of a match or phase, specifying whether they have not started, are in progress or have been completed.
      required: true
      schema:
        type: string
        enum:
        - CURRENT
        - RECENT
        - UPCOMING
    languageParam:
      name: preferredLanguage
      in: query
      description: The preferred language for the content is a two-letter country and two-letter language code, such as en-US. The API returns localized strings in the specified language if available. Otherwise, the API will default to the primary language of the contentMarket.
      required: true
      schema:
        pattern: ^[a-z]{2}-[A-Z]{2}$
        examples:
        - en-GB
  schemas:
    PeriodNumber:
      type:
      - string
      - 'null'
      description: For the current period type, this is the ordinal number of the period. For example, the 3rd quarter of a match will have a `periodNumber` of 3 and `periodType` of `REGULATION_TIME` while the 1st overtime will have a `periodNumber` of `1` and `periodType` of `OVERTIME`.
    Match:
      type: object
      additionalProperties: false
      required:
      - matchID
      - sportType
      - status
      - scheduledStartTimeUTC
      - parentEvent
      - matchState
      - participants
      - statusDetail
      properties:
        matchID:
          type: string
        sportType:
          $ref: '#/components/schemas/SportType'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        status:
          $ref: '#/components/schemas/Status'
        scheduledStartTimeUTC:
          type: string
          format: date-time
          examples:
          - '2024-09-13T22:40:00.000Z'
        statusDetail:
          $ref: '#/components/schemas/StatusDetail'
        parentEvent:
          $ref: '#/components/schemas/ParentEvent'
        matchState:
          $ref: '#/components/schemas/MatchState'
    Phase:
      type: object
      additionalProperties: false
      required:
      - phaseID
      - name
      - nameShort
      - sportType
      - participants
      - status
      - statusDetail
      - parentEvent
      - scheduledStartTimeUTC
      - phaseState
      properties:
        phaseID:
          type: string
        name:
          type:
          - string
          - 'null'
        nameShort:
          type:
          - string
          - 'null'
        sportType:
          $ref: '#/components/schemas/SportType'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        status:
          $ref: '#/components/schemas/Status'
        statusDetail:
          $ref: '#/components/schemas/StatusDetail'
        parentEvent:
          $ref: '#/components/schemas/ParentEvent'
        scheduledStartTimeUTC:
          type: string
          format: date-time
          examples:
          - '2026-01-04T22:30:00.000Z'
        phaseState:
          $ref: '#/components/schemas/PhaseState'
    ParticipantTypeDetail:
      type:
      - string
      - 'null'
      description: TEAM_DEFINED teams are a combination of 2 persons that compete together in national and international leagues. An example would be tennis doubles.
      enum:
      - TEAM_CONSTRUCTOR
      - TEAM_CLUB
      - TEAM_NATIONAL
      - TEAM_ALL_STAR
      - TEAM_DEFINED
      - TEAM_PLACEHOLDER
      - null
    PersonsResponse:
      type: object
      additionalProperties: false
      required:
      - meta
      - data
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Person'
    PeriodType:
      type:
      - string
      - 'null'
      description: See `periodNumber` for usage examples. `END_PERIOD`, `END_REGULATION_TIME`, `END_OVERTIME_PERIOD` and `END_OVERTIME` are the breaks between one period type and another.
      enum:
      - REGULATION_TIME
      - END_PERIOD
      - END_REGULATION_TIME
      - OVERTIME
      - END_OVERTIME_PERIOD
      - END_OVERTIME
      - SHOOTOUT
      - null
    Organization:
      type: object
      additionalProperties: false
      required:
      - organizationID
      - organizationType
      - organizationTypeDetail
      - name
      - nameShort
      - nameAbbreviation
      - images
      properties:
        organizationID:
          type: string
        organizationType:
          type: string
          enum:
          - TEAM
          - CONSTRUCTOR
          - TIER
          - CONFERENCE
          - DIVISION
        organizationTypeDetail:
          $ref: '#/components/schemas/ParticipantTypeDetail'
        name:
          type: string
        nameShort:
          type:
          - string
          - 'null'
        nameAbbreviation:
          type:
          - string
          - 'null'
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
    LeaguesResponse:
      type: object
      additionalProperties: false
      required:
      - meta
      - data
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/League'
    Status:
      type: string
      enum:
      - UPCOMING
      - CURRENT
      - RECENT
      - UNKNOWN
    Period:
      type: object
      additionalProperties: false
      required:
      - periodNumber
      - periodType
      - homeScore
      - awayScore
      - homeTieBreak
      - awayTieBreak
      - homeShots
      - awayShots
      - homePossessionSeconds
      - awayPossessionSeconds
      properties:
        periodNumber:
          $ref: '#/components/schemas/PeriodNumber'
        periodType:
          $ref: '#/components/schemas/PeriodType'
        homeScore:
          type:
          - string
          - 'null'
        awayScore:
          type:
          - string
          - 'null'
        homeTieBreak:
          type:
          - string
          - 'null'
          description: Tennis.
        awayTieBreak:
          type:
          - string
          - 'null'
          description: Tennis.
        homeShots:
          type:
          - string
          - 'null'
          description: Shots on goal for this period. Ice hockey.
        awayShots:
          type:
          - string
          - 'null'
          description: Shots on goal for this period. Ice hockey.
        homePossessionSeconds:
          type:
          - string
          - 'null'
          description: Time of possession in seconds for this period. American football.
        awayPossessionSeconds:
          type:
          - string
          - 'null'
          description: Time of possession in seconds for this period. American football.
    Image:
      type: object
      additionalProperties: false
      required:
      - orientation
      - type
      - URL
      - contentType
      properties:
        orientation:
          type: string
          description: Orientation of the image.
          enum:
          - LANDSCAPE
          - PORTRAIT
          - SQUARE
        type:
          type: string
          enum:
          - ARTWORK
          - LOGO
          - HEADSHOT
          - FLAG
          - ARTIST
          - JERSEY
          - POSTER
          - BANNER
          - IMAGE_3_4
          - IMAGE_4_3
          - IMAGE_16_9
          - BRAND_LOGO
        URL:
          type: string
          description: Note that some image hosting platforms require a user-agent header to be specified when fetching images.
        contentType:
          type:
          - string
          - 'null'
    PeriodDetails:
      type: object
      description: Information about the current period and an array of completed and in-progress periods.
      additionalProperties: false
      required:
      - periodNumber
      - periodType
      - periodState
      - periods
      properties:
        periodState:
          type:
          - string
          - 'null'
          description: For sports like baseball, this will indicate the state of the current period. 'Top' if it is the top of the inning.
        periodNumber:
          $ref: '#/components/schemas/PeriodNumber'
        periodType:
          $ref: '#/components/schemas/PeriodType'
        servingParticipantGroup:
          type:
          - string
          - 'null'
          deprecated: true
          description: Use matchState's possessionParticipantGroup instead.
        periods:
          type: array
          description: This array has the period details for the match that have been completed or are in progress. For tennis, this will be the details of each set. For NBA games, the details of each quarter, etc.
          items:
            $ref: '#/components/schemas/Period'
    Team:
      type: object
      additionalProperties: false
      required:
      - teamID
      - name
      - nameAbbreviation
      - nameShort
      - participantTypeDetail
      - images
      - color
      - nationality
      - hasPhases
      - hasMatches
      - currentRanking
      properties:
        teamID:
          type: string
        nameShort:
          type:
          - string
          - 'null'
        name:
          type: string
        nameAbbreviation:
          type:
          - string
          - 'null'
        participantTypeDetail:
          $ref: '#/components/schemas/ParticipantTypeDetail'
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        color:
          type:
          - string
          - 'null'
          description: Hex representation of the team color.
        nationality:
          $ref: '#/components/schemas/Nationality'
        hasPhases:
          type: boolean
        hasMatches:
          type: boolean
        currentRanking:
          $ref: '#/components/schemas/ShortRanking'
    MatchesResponse:
      type: object
      additionalProperties: false
      required:
      - meta
      - data
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Match'
    TeamsResponse:
      type: object
      additionalProperties: false
