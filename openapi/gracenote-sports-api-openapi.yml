        description: Size of the image referenced by the preferred image URI returned. The default value is Md (medium)
      responses:
        '200':
          description: Successful response
      operationId: getV11SportsOrganizationsByOrganizationId
      x-operation-id-source: derived
    servers:
    - url: /proxy/onconnect
  /v1.1/sports/universities/{universityId}:
    get:
      summary: Teams at a University
      description: Returns a list of all teams associated with specified universities. *Available with R&D/Commercial plans only.
      tags:
