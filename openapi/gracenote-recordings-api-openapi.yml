    Asset:
      title: image asset
      type: object
      additionalProperties: false
      properties:
        size:
          type: string
          nullable: false
        height:
          type: integer
          nullable: false
        width:
          type: integer
          nullable: false
        url:
          type: string
          pattern: ^https://
      required:
      - size
      - height
      - width
      - url
    DescriptorObject_2:
      nullable: false
      title: descriptor object
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          type:
            type: string
            enum:
            - artistTypes
            - eras
            - genres
            - languages
            - moods
            - origins
            - styles
            - tempos
          weight:
            type: integer
          hierarchy:
            nullable: false
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                label:
                  nullable: false
                  type: string
                descriptorID:
                  nullable: false
                  type: string
                level:
                  type: integer
        required:
        - type
        - weight
        - hierarchy
    ErrorResponse_2:
      title: error response
      type: object
      additionalProperties: false
      nullable: false
      properties:
        status:
          type: integer
          nullable: false
        error:
          type: string
          nullable: false
          enum:
          - page_not_found
          - resource_not_found
          - invalid_query_parameter_key
          - invalid_query_parameter_value
          - missing_query_parameter_key
          - resource_type_error
          - internal_server_error
          - unauthorized_invalid_api_key
          - unauthorized_missing_api_key
          - missing_api_key
          - rate_limit_exceeded
          - missing_entitlement
        description:
          type: string
          nullable: false
      required:
      - status
      - error
      - description
    ArtistShortWithImages:
      title: artist
      type: object
      additionalProperties: false
      properties:
        artistID:
          nullable: false
          type: string
          description: Gracenote Artist ID
        artistName:
          type: string
          description: Artist Name
        images:
          nullable: false
          type: array
          description: 'An array of the images for the artist. Returns one classic image with one size (largest available), selected by hierarchy: Preferred > Latest Promotional > Latest In Performance > Latest Red Carpet. Enhanced images (headshot, iconic, backdrop) are included when artist-enhanced-image add-on is present. The first entry is the preferred image. Only visible to Customers with Artist Images add-on'
          items:
            $ref: '#/components/schemas/Image_2'
      required:
      - artistID
      - artistName
    PopularityData:
      title: popularity data
      description: 'Popularity score is on a scale of 0 to 1, with a resolution out to 5 decimal places, which is derived

        from a proprietary blend of signals and indicates the relative All-Time, or Recent popularity of Artists

        and Recordings.

        Only visible to Customers with Popularity Add On

        '
      type:
      - object
      - 'null'
      additionalProperties: false
      properties:
        overall:
          nullable: false
          type: array
          items:
            $ref: '#/components/schemas/PopularityObject'
        audio:
          nullable: false
          type: array
          items:
            $ref: '#/components/schemas/PopularityObject'
        video:
          nullable: false
          type: array
          items:
            $ref: '#/components/schemas/PopularityObject'
      required:
      - overall
      - audio
      - video
