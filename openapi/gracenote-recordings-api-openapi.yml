openapi: 3.2.0
info:
  title: Gracenote Recordings API
  version: '1.0'
  description: 'Operations tagged Recordings across 2 of this provider''s published API definitions: gracenote-gmd-api-v2-openapi.json, gracenote-gmd-api-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /proxy/gmd/v2
- url: https://api.gmd.music.gracenote.com/v3
tags:
- name: Recordings
paths:
  /recordings/search:
    get:
      tags:
      - Recordings
      summary: Recording text search
      description: 'Text search for `Recording` objects using recording name and/or artist name.


        Note that one of either recording or artist name is required. Omitting both

        will result in an error.'
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
      - $ref: '#/components/parameters/recordingName'
      - $ref: '#/components/parameters/artistName'
      - $ref: '#/components/parameters/isrc'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/categoriesLanguage'
      - $ref: '#/components/parameters/genreCategories'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  data:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/RecordingObject'
                required:
                - meta
                - data
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      operationId: getRecordingsSearch
      x-operation-id-source: derived
    servers:
    - url: /proxy/gmd/v2
  /recordings/{idType}:
    get:
      tags:
      - Recordings
      summary: Lookup Recording(s) by ID
      description: 'Get `Recording` object(s) by ID


        **Notes**

        * Objects are returned in order requested.

        * If an object is not found, a `null` value is returned in its position.

        * Duplicate ids in the query will result in duplicate objects in the response


        **Example:** Lookup by Gracenote ID


        `https://.../recordings/gnid?ids=GN0TR5Z86C868HS`


        **Example:** Lookup by ISRC


        `https://.../recordings/isrc?ids=DEY371001140`'
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
      - $ref: '#/components/parameters/recordingIDType'
      - $ref: '#/components/parameters/ids'
      - $ref: '#/components/parameters/categoriesLanguage'
      - $ref: '#/components/parameters/genreCategories'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  data:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/RecordingObject'
                required:
                - meta
                - data
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      operationId: getRecordingsByIdType
      x-operation-id-source: derived
    servers:
    - url: /proxy/gmd/v2
  /recordings/lookup:
    get:
      tags:
      - Recordings
      summary: Lookup Recording(s) by ID
      description: 'Get `Recording` object(s) by ID


        **Notes**

        * Objects are returned in order requested.

        * Only one object is returned per ID. *so if the input ID matches multiple objects, only one will be returned.*

        * If an object is not found, a 404 is returned along with a message indicating which ID wasn''t found.

        * Duplicate ids in the query will result in a 400 response.


        **Example:** Lookup by Gracenote recording ID


        `https://.../recordings/lookup?ids=GN0TR5Z86C868HS&idType=recordingID`


        **Example:** Lookup by ISRC


        `https://.../recordings/lookup?ids=DEY371001140&idType=isrc`'
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
      - $ref: '#/components/parameters/idTypeRecordings'
      - $ref: '#/components/parameters/ids_2'
      - $ref: '#/components/parameters/displayLanguage'
      - $ref: '#/components/parameters/genreList'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta_2'
                  data:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/RecordingObject_2'
                required:
                - meta
                - data
        '400':
          $ref: '#/components/responses/ErrorResponse400_2'
        '404':
          $ref: '#/components/responses/ErrorResponse404_2'
      security:
      - ApiKeyAuth: []
      operationId: getRecordingsLookup
      x-operation-id-source: derived
    servers:
    - url: https://api.gmd.music.gracenote.com/v3
  /recordings/explore:
    get:
      tags:
      - Recordings
      summary: Explore Recordings(s)
      description: 'Get `Recording` object(s) - optionally filtered and sorted.


        Without any query parameters, the `explore` Recordings endpoint will return the most highly consumed recordings Globally over the past year.


        ***Note: When adding an `artistID` filter parameter, the best practice is to set `includeRelatedArtists` to include `memberOfKeyArtists` and `memberOfCollaborations`. This will ensure a complete set of recordings for the given artist.***


        **Example:** Explore recordings by an artist


        `https://.../recordings/explore?artistIDs=GMGZZX800003Y64&includeRelatedArtists=memberOfKeyArtists,memberOfCollaborations`'
      parameters:
      - $ref: '#/components/parameters/apiKeyParam'
      - $ref: '#/components/parameters/artistIDs'
      - $ref: '#/components/parameters/includeRelatedArtists'
      - $ref: '#/components/parameters/sortRecordings'
      - $ref: '#/components/parameters/popularityRegion'
      - $ref: '#/components/parameters/genreIDs'
      - $ref: '#/components/parameters/originIDs'
      - $ref: '#/components/parameters/eraIDs'
      - $ref: '#/components/parameters/artistTypeIDs'
      - $ref: '#/components/parameters/moodIDs'
      - $ref: '#/components/parameters/tempoIDs'
      - $ref: '#/components/parameters/styleIDs'
      - $ref: '#/components/parameters/videoQuality'
      - $ref: '#/components/parameters/videoType'
      - $ref: '#/components/parameters/limit_2'
      - $ref: '#/components/parameters/offset_2'
      - $ref: '#/components/parameters/displayLanguage'
      - $ref: '#/components/parameters/genreList'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta_2'
                  data:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/RecordingObject_2'
                required:
                - meta
                - data
        '400':
          $ref: '#/components/responses/ErrorResponse400_2'
      security:
      - ApiKeyAuth: []
      operationId: getRecordingsExplore
      x-operation-id-source: derived
    servers:
    - url: https://api.gmd.music.gracenote.com/v3
components:
  schemas:
    ExternalID:
      type: object
      properties:
        source:
          type: string
        ID:
          type: string
    ResponseMeta:
      type: object
      nullable: false
      additionalProperties: false
      properties:
        total:
          type: integer
          nullable: false
        count:
          type: integer
          nullable: false
        offset:
          type: integer
          nullable: false
        references:
          type: object
          properties:
            genreCategories:
              type: string
            categoriesLanguage:
              type: string
      required:
      - total
      - count
      - offset
    Image:
      type: object
      properties:
        size:
          type: string
        height:
          type: integer
        width:
          type: integer
        url:
          type: string
          pattern: ^https://
    Popularity:
      type: object
      properties:
        region:
          type: string
        score:
          type: number
        type:
          type: string
    RecordingObject:
      type:
      - object
      - 'null'
      properties:
        type:
          type: string
          description: '[recordings]'
        artist:
          $ref: '#/components/schemas/ArtistWithImage'
        descriptors:
          description: Only visible to Customers with GMD Discovery/Advanced Discovery package
          type:
          - object
          - 'null'
          properties:
            artistTypes:
              $ref: '#/components/schemas/DescriptorObject'
            eras:
              $ref: '#/components/schemas/DescriptorObject'
            genres:
              $ref: '#/components/schemas/DescriptorObject'
            moods:
              $ref: '#/components/schemas/DescriptorObject'
            origins:
              $ref: '#/components/schemas/DescriptorObject'
            styles:
              $ref: '#/components/schemas/DescriptorObject'
            tempos:
              $ref: '#/components/schemas/DescriptorObject'
        duration:
          type: string
        externalIDs:
          type:
          - array
          - 'null'
          description: Only visible to Customers with Partner IDs Add on
          items:
            $ref: '#/components/schemas/ExternalID'
        href:
          description: will be of the type /recordings/gnid?ids=GNXX
          type: string
        popularity:
          type:
          - array
          - 'null'
          description: Only visible to Customers with Popularity Add On
          items:
            $ref: '#/components/schemas/Popularity'
        isrcs:
          type:
          - array
          - 'null'
          description: Only visible to Customers with Industry IDs Add on
          items:
            type: string
            nullable: false
            pattern: ^[A-Z]{2}[A-Z0-9]{3}\d{7}$
        recordingID:
          description: gracenote ID
          type: string
        recordingName:
          type: string
        releaseYear:
          description: Only visible to Customers with GMD:Search Package
          type:
          - string
          - 'null'
        selectedAlbumEdition:
          type: object
          description: Only visible to Customers Search Package
          properties:
            href:
              type: string
            selectedAlbumEditionID:
              type: string
            selectedAlbumEditionName:
              type: string
            images:
              type:
              - array
              - 'null'
              description: Only visible to Customers with Cover Art add-on
              items:
                $ref: '#/components/schemas/Image'
    DescriptorObject:
      type: array
      description: Only visible to Customers with GMD Discovery/Advanced Discovery package.
      items:
        type: object
        properties:
          type:
            type: string
          ID:
            type: string
          name:
            type: string
          weight:
            type: integer
          categories:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                level:
                  type: integer
          links:
            type: object
            properties:
              descriptorCorrelations:
                description: Only visible to Customers with GMD:Advanced Discovery package and above. will be of the type /descriptorCorrelations/{descriptorType}?id=ID
                type: string
    ErrorResponse:
      type: object
      nullable: false
      additionalProperties: false
      properties:
        status:
          type: integer
          nullable: false
        error:
          type: string
          nullable: false
        description:
          type: string
          nullable: false
      required:
      - status
      - error
      - description
    ArtistWithImage:
      type: object
      properties:
        artistID:
          type:
          - string
          - 'null'
          description: gracenote ID
        artistName:
          type: string
        href:
          type:
          - string
          - 'null'
          description: will be of the type /artists/gnid?ids=GNXX
        images:
          type:
          - array
          - 'null'
          description: Only visible to Customers with Artist Images add-on
          items:
            $ref: '#/components/schemas/Image'
    ExternalID_2:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
        ID:
          type: string
      required:
      - source
      - ID
    YouTubeID:
      title: YouTube video link
      type: object
      additionalProperties: false
      properties:
        channelID:
          type: string
        videoID:
          type: string
        videoQuality:
          type: string
          enum:
          - HD
          - SD
        videoType:
          type:
          - string
          - 'null'
      required:
      - channelID
      - videoID
      - videoQuality
      - videoType
    IndustryCode:
      title: industry code
      type: object
      description: Industry codes like ISRCs and ICPNs.
      additionalProperties: false
      properties:
        type:
          type: string
        code:
          type: string
      required:
      - type
      - code
    ResponseMeta_2:
      title: meta object
      type: object
      additionalProperties: false
      nullable: false
      properties:
        total:
          type: integer
          nullable: false
          description: Total data objects for the query criteria
        count:
          type: integer
          nullable: false
          description: Count of objects in the returned result set
        offset:
          type: integer
          nullable: false
          description: Current offset for result set
        references:
          type: object
          additionalProperties: false
          properties:
            genreList:
              type: string
              description: Hierarchical Genre List used for response.
            displayLanguage:
              type: string
              description: Display language used for descriptor strings.
      required:
      - total
      - count
      - offset
      examples:
      - total: 1
        count: 1
        offset: 0
        references:
          genreList: GENRES-US-DETAILED
          displayLanguage: en
    Image_2:
      title: image
      type: object
      additionalProperties: false
      properties:
        imageType:
          type: string
          description: 'Image type identifier. Classic artist images: artistImage-promotional, artistImage-inPerformance, artistImage-redCarpet, artistImage-other. Enhanced artist images: artistImage-headshot, artistImage-iconic, artistImage-backdrop. Album images: coverArt.'
          enum:
          - artistImage-promotional
          - artistImage-inPerformance
          - artistImage-redCarpet
          - artistImage-other
          - artistImage-headshot
          - artistImage-iconic
          - artistImage-backdrop
          - coverArt
        imageID:
          type: string
          nullable: false
        preferred:
          type: string
          description: 'Indicates if this is a preferred image. Only present for classic artist images. Values: ''true'' or ''false''.'
          enum:
          - 'true'
          - 'false'
        assets:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/Asset'
      required:
      - imageType
      - imageID
      - assets
    PopularityObject:
      title: regional popularity
      nullable: false
      type: object
      additionalProperties: false
      properties:
        region:
          nullable: false
          type: string
        oneYear:
          type:
          - number
          - 'null'
        oneMonth:
          type:
          - number
          - 'null'
      required:
      - region
      - oneYear
      - oneMonth
    RecordingObject_2:
      title: recording object
      nullable: false
      type: object
      additionalProperties: false
      properties:
        objectType:
          enum:
          - recording
          description: The object type.
          type: string
        artist:
          $ref: '#/components/schemas/ArtistShortWithImages'
        descriptors:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: Descriptor data is only returned to Customers with GMD Discovery/Advanced Discovery package.
          properties:
            artistTypes:
              $ref: '#/components/schemas/DescriptorObject_2'
            eras:
              $ref: '#/components/schemas/DescriptorObject_2'
            genres:
              $ref: '#/components/schemas/DescriptorObject_2'
            moods:
              $ref: '#/components/schemas/DescriptorObject_2'
            origins:
              $ref: '#/components/schemas/DescriptorObject_2'
            styles:
              $ref: '#/components/schemas/DescriptorObject_2'
            tempos:
              $ref: '#/components/schemas/DescriptorObject_2'
        durationMilliseconds:
          type: integer
          nullable: false
        externalIDs:
          nullable: false
          type: array
          description: Only visible to Customers with Partner IDs add-on
          items:
            $ref: '#/components/schemas/ExternalID_2'
        industryCodes:
          nullable: false
          type: array
          description: Release codes associated with the recording. Only visible to Customers with Partner IDs add-on
          items:
            $ref: '#/components/schemas/IndustryCode'
        popularity:
          $ref: '#/components/schemas/PopularityData'
        youtubeIDs:
          nullable: false
          type: array
          description: Linked YouTube videos. Only visible to Customers with youtube-video-id add-on.
          items:
            $ref: '#/components/schemas/YouTubeID'
        recordingID:
          nullable: false
          description: Gracenote Recording ID
          type: string
        recordingName:
          nullable: false
          type: string
        releaseYear:
          description: Only visible to Customers with GMD Search package
          type:
          - integer
          - 'null'
        selectedAlbumEdition:
          type: object
          additionalProperties: false
          description: Single, algorithmically assigned Album Edition associated with the optimum track instance in a Recording object. Only visible to Customers with GMD Search package
          properties:
            selectedAlbumEditionID:
              type:
              - string
              - 'null'
            selectedAlbumEditionName:
              type:
              - string
              - 'null'
            images:
              nullable: false
              type: array
              description: An array of the images for the album edition. Returns one image with one size (largest available). The first entry is the preferred image. Only visible to Customers with Cover Art add-on
              items:
                $ref: '#/components/schemas/Image_2'
        submittedRecordingID:
          type:
          - string
          - 'null'
          description: The Gracenote Recording ID as submitted in the API request. Populated when a GNID lookup returns this entity. Null for search, non-GNID lookups, and explore endpoints.
        submittedArtistID:
          type:
          - string
          - 'null'
          description: The Gracenote Artist ID as submitted in the API request. Populated when an explore endpoint filtered by artistIDs returns this entity. Null for lookup and search endpoints.
      required:
      - objectType
      - artist
      - durationMilliseconds
      - recordingID
      - recordingName
      examples:
      - "{\n  \"artist\": {\n    \"artistID\": \"GMGZZX8000008Y0\",\n    \"artistName\": \"Sun Ra\",\n    \"images\": [\n      {\n        \"imageType\": \"artistImage-promotional\",\n        \"imageID\": \"509B5DA88F67D29F\",\n        \"preferred\": \"true\",\n        \"assets\": [\n          {\n            \"size\": \"XLARGE\",\n            \"width\": 1080,\n            \"height\": 730,\n            \"url\": \"https://akamai-b.cdn.cddbp.net/cds/2.0/image/509B/5DA8/8F67/D29F_xlarge_front.jpg\"\n          },\n          {\n            \"size\": \"LARGE\",\n            \"width\": 720,\n            \"height\": 486,\n            \"url\": \"https://akamai-b.cdn.cddbp.net/cds/2.0/image/509B/5DA8/8F67/D29F_large_front.jpg\"\n          },\n          {\n            \"size\": \"MEDIUM\",\n            \"width\": 450,\n            \"height\": 304,\n            \"url\": \"https://akamai-b.cdn.cddbp.net/cds/2.0/image/509B/5DA8/8F67/D29F_medium_front.jpg\"\n          },\n          {\n            \"size\": \"SMALL\",\n            \"width\": 170,\n            \"height\": 114,\n            \"url\": \"https://akamai-b.cdn.cddbp.net/cds/2.0/image/509B/5DA8/8F67/D29F_small_front.jpg\"\n          },\n          {\n            \"size\": \"THUMBNAIL\",\n            \"width\": 75,\n            \"height\": 50,\n            \"url\": \"https://akamai-b.cdn.cddbp.net/cds/2.0/image/509B/5DA8/8F67/D29F_thumbnail_front.jpg\"\n          }\n        ]\n      }\n    ]\n  },\n  \"descriptors\": {\n    \"artistTypes\": [\n      {\n        \"hierarchy\": [\n          {\n            \"level\": 1,\n            \"descriptorID\": \"29422\",\n            \"label\": \"Male\"\n          },\n          {\n            \"level\": 2,\n            \"descriptorID\": \"29426\",\n            \"label\": \"Male\"\n          },\n          {\n            \"level\": 3,\n            \"descriptorID\": \"23701\",\n            \"label\": \"Male Solo - Solo Instrumental\"\n          }\n        ],\n        \"type\": \"artistTypes\",