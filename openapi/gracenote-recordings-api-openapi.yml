      name: isrc
      in: query
      description: Include ISRC in search criteria.  Note that due to ISRC consistency issues (e.g., duplicate or incorrect ISRC), ISRC field matching is a lower priority than text field matching (e.g., artist name).
      schema:
        type: string
    recordingName:
      name: recordingName
      in: query
      description: Recording name
      required: true
      schema:
        type: string
      examples:
        default:
          value: Old Town Road
    limit:
      name: limit
      in: query
      description: Limit the number of results between 1 and 10,000.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 100
    apiKeyParam:
      name: GN-APIKEY
      in: header
      description: API key to authorize the request.
      required: true
      schema:
        type: string
        examples:
        - your-api-key
    ids:
      name: ids
      in: query
      required: true
      description: Comma seperated list of ids (max 100)
      schema:
        type: string
    recordingIDType:
      name: idType
      in: path
      required: true
      description: ID Type
      schema:
        type: string
        enum:
        - gnid
        - isrc
        - appletrackid
        - spotify-track-id
        - deezer-global-track-id
