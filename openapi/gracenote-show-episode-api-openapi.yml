                      additionalProperties:
                        type: string
                    examples:
                    - subType:
                        error: subType is a required field
                  instance:
                    type: string
                    examples:
                    - /api/v1/shows
                  meta:
                    type: object
                    properties:
                      rayID:
                        type: string
