openapi: 3.2.0
info:
  title: Global Sports Data Lookup API v1 Overall Endpoints API
  description: This page contains all Lookup API endpoints that are part of our Core Sports Data.
  version: '1'
servers:
- url: /proxy/sports
tags:
- name: Overall Endpoints
paths:
  /gsd/lookup/v1/overalls/{overallId}:
    get:
      tags:
      - Overall Endpoints
      summary: Overall Info
      operationId: OverallInfo
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: overallId
        in: path
        required: true
        schema:
          type: string
          default: GNEYFW8HYN7ZKEP
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/overalls/{overallId}/results:
    get:
      tags:
      - Overall Endpoints
      summary: Results by Overall
      operationId: ResultsbyOverall
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: overallId
        in: path
        required: true
        schema:
          type: string
          default: GNEYFW8HYN7ZKEP
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/overalls/{overallId}/classifications:
    get:
      tags:
      - Overall Endpoints
      summary: Classifications by Overall
      operationId: ClassificationsbyOverall
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: overallId
        in: path
        required: true
        schema:
          type: string
          default: GNEYFW8HYN7ZKEP
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
  /gsd/lookup/v1/overalls/{overallId}/intermediates:
    get:
      tags:
      - Overall Endpoints
      summary: Intermediates by Overall
      operationId: IntermediatesbyOverall
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - $ref: '#/components/parameters/AcceptHeader'
      - name: overallId
        in: path
        required: true
        schema:
          type: string
          default: GN46CN6M8X623HW
      - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Successful response
components:
  parameters:
    AcceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        enum:
        - application/json
        default: application/json
    ApiKeyQuery:
      name: api_key
      in: query
      required: true
      description: API key for authentication
      schema:
        type: string
    LanguageQuery:
      name: language
      in: query
      description: Language Code which will translate all translatable fields into the requested language.
      schema:
        type: string
        enum:
        - ''
        - ar-SA
        - cs-CZ
        - da-DK
        - de-DE
        - el-GR
        - en-GB
        - en-US
        - es-ES
        - fi-FI
        - fr-FR
        - hu-HU
        - it-IT
        - ja-JP
        - ko-KR
        - nb-NO
        - nl-BE
        - nl-NL
        - pl-PL
        - pt-BR
        - pt-PT
        - ro-RO
        - ru-RU
        - sv-SE
        - tr-TR
        - zh-CN
        - zh-HK
        default: en-GB
