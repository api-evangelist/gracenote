      properties:
        language:
          type: string
          description: 'The language of the title''s text. User must be entitled to use the language.

            See the Gracenote Vocabulary for valid languages.'
        value:
          type: string
          description: The text of the title.
      description: 'Title holds information about

        a program''s title.'
    Name:
      required:
      - first
      type: object
      properties:
        first:
          type: string
          description: The first name of the member.
        last:
          type: string
          description: The last name of the member.
        middle:
          type: string
          description: The middle name of the member.
        prefix:
          type: string
          description: The prefix of the member's name.
        suffix:
          type: string
          description: The suffix of the member's name.
      description: 'Name contains the components of the full name

        of a crew or cast member.'
    Rating:
      required:
      - ratingBody
      type: object
      properties:
        advisories:
          type: array
          description: 'Content advisories that should be attached to the presentation.

            Free form entry. Reference the GN Vocabulary for suggested advisories.'
          items:
            type: string
          examples:
          - - contains strong language
        notYetRated:
          type: boolean
          description: When true, indicates that the presentation is yet to be rated.
        rating:
          type: string
          description: 'The assigned rating value as determined by the rating body.

            Required if ratingBody & notYetRated are false.'
          examples:
          - PG-13
        ratingBody:
          type: string
          description: The rating body responsible for assigning ratings.
          examples:
          - MPAA
        ratingExempt:
          type: boolean
          description: 'When set to true, indicates that the presentation is exempt from and

            will not receive ratings.'
      description: Rating represents a rating of a program as assigned by a rating body
    DeletedEpisode:
      type: object
      properties:
        gnID:
          type: string
          description: The Gracenote ID of the deleted program.
          readOnly: true
          examples:
          - GNLZZXZ00000001
        seasonGnID:
          type: string
          description: The Gracenote ID of the episode's parent season.
      description: DeletedEpisode reports the gnID of an episode and its parent Season
    DeleteVersionPresentationMappingsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/VersionPresentationMapping'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    DeletedShowPresentation:
      type: object
      properties:
        gnID:
          type: string
          description: The Gracenote ID of the deleted program.
          readOnly: true
          examples:
          - GNLZZZ200000001
        seasons:
          type: array
          description: The deleted show seasons that belong to the deleted show presentation.
          readOnly: true
          items:
            $ref: '#/components/schemas/DeletedShowSeason'
        versionGnID:
          type: string
          description: The Gracenote ID of the presentation's parent version.
          readOnly: true
          examples:
          - GNLZZZ300000001
      description: 'DeletedPresentation contains the ID of the deleted Presentation as well as

        the parent and child IDs of the Presentation.'
    DeletedShowPresentationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeletedShowPresentation'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    FieldError:
      type: object
      properties:
        error:
          type: string
        field:
          type: string
        level:
          type: string
      description: FieldError is used to indicate an error with a specific request field
    ShowPresentationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShowPresentation'
        meta:
          $ref: '#/components/schemas/MetaResponse'
  parameters:
    apiKeyParam:
      name: GN-APIKEY
      in: header
      description: API key to authorize the request.
      required: true
      schema:
        type: string
        examples:
        - your-api-key
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: GN-APIKEY
      description: API key to authorize the request. Click Authorize and paste the key created for your application.
