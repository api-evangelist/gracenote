components:
  schemas:
    NewShowPresentation:
      description: NewPresentation represents the fields required for creating a presentation of a show
      required:
      - title
      - subType
      type: object
      properties:
        cast:
          type: array
          description: 'The cast of the presentation.


            Each cast''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Cast'
        crew:
          type: array
          description: 'The crew of the presentation.


            Each crew''s order field must be unique.'
          items:
            $ref: '#/components/schemas/Crew'
        descriptions:
          $ref: '#/components/schemas/Descriptions'
        externalIDs:
          $ref: '#/components/schemas/ExternalIDs'
        finaleDate:
          type: string
          description: The date at which the series ends with a series finale.
          format: date
        genres:
          type: array
          description: 'The applicable genres to the presentation.


            Genres are not required for creating a presentation,

            but at least one is required for publishing.

            Genres is required for update when the presentation is

            in publishing/published state.'
          items:
            type: string
          examples:
          - - Fantasy
            - Adventure
        originalSource:
          type: string
          description: 'The original source of the program (or network if

            the program originated on a network).'
          examples:
          - Lifetime
        presentationLabels:
          type: array
          description: 'Describes content information and/or contextual business tags to describe

            the intent of the presentation.'
          items:
            type: string
          examples:
          - - UK EN
            - US EN
        productionCompanies:
          type: array
          description: Any companies that have contributed in the production of the program.
          items:
            type: string
          examples:
          - - Newline
        productionCountries:
          type: array
          description: 'Any countries that the program was produced in.

            See the Gracenote Vocabulary for valid country codes.'
          items:
            type: string
          examples:
          - - CA
        ratings:
          type: array
          description: The ratings for this presentation.
          items:
            $ref: '#/components/schemas/Rating'
          examples:
          - - advisories:
              - contains strong language
              rating: PG-13
              ratingBody: MPAA
        releaseDate:
          type: string
          description: 'The date on which the series was released.


            ReleaseDate is optional for creating a presentation, but is required for publishing.

            ReleaseDate is required for update when the presentation is

            in publishing/published state.'
          format: date
        targetAudience:
          type: string
          description: The primary demographic that the program is targeted towards.
          examples:
          - children
        title:
          $ref: '#/components/schemas/Title'
        subType:
          type: string
          description: The high-level type of the program.
          examples:
          - series
        type:
          type: string
          description: The high-level type of the program.
          readOnly: true
          examples:
          - show
    ExternalID:
      required:
      - id
      - isPrimary
      type: object
      properties:
        id:
          type: string
          description: id is the external identifier.
        isPrimary:
          type: boolean
          description: 'indicates that the external ID is the primary ID

            used to identify the program external to Gracenote.

            Exactly one primary external ID is allowed (and required) per program.'
        isProvider:
          type: boolean
          description: 'indicates that the source provider uses this ID as

            their internal ID for the program. Exactly one provider

            external ID is allowed per program.'
        label:
          type: string
          description: label is a tag to describe the identifier.
      description: ExternalID is an external (to Gracenote) identifier of the program
    ShowPresentationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ShowPresentation'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    Description:
      required:
      - language
      - length
      - value
      type: object
      properties:
        language:
          type: string
          description: 'Language of the description''s text. User must be entitled to use the language.

            See the Gracenote Vocabulary for valid languages.'
        length:
          type: integer
          description: 'Length defines the maximum number of characters that can be used in a description.

            The value of the description must be less than or equal to the specified length from values 1 to 1000.'
          format: int64
        value:
          type: string
          description: Value is the raw text description of a program.
      description: Description is a set of fields that describe a program
    DeletedShowSeason:
      type: object
      properties:
        episodes:
          type: array
          description: The deleted episodes that belong to the deleted show season.
          items:
            $ref: '#/components/schemas/DeletedEpisode'
        gnID:
          type: string
          description: The Gracenote ID of the deleted season.
          readOnly: true
          examples:
          - GNLZZXV00000001
        showPresentationGnID:
          type: string
          description: The ID of the season's parent presentation.
      description: 'DeletedSeason contains the ID of the deleted Season as well as

        the parent and child IDs of the Season.'
    VersionPresentationMapping:
      type: object
      properties:
        presentationGnID:
          type: string
        versionGnID:
          type: string
    ExternalIDs:
      type: array
      description: ExternalIDs is a convenience alias on a slice of ExternalID types
      items:
        $ref: '#/components/schemas/ExternalID'
    Crew:
      description: 'Crew is a member who was part of

        a program''s production crew.'
      required:
      - name
      - order
      - type
      type: object
      properties:
        aka:
          $ref: '#/components/schemas/Name'
        name:
          $ref: '#/components/schemas/Name'
        order:
          minimum: 1
          type: integer
          description: 'Order in which the cast member appears on the billing. Must be unique

            per program and cannot be negative or zero.'
          format: int64
          examples:
          - 1
        type:
          type: string
          description: 'Type describes the role or "crew type" of the crew member.

            Defined by the Gracenote Vocabulary.'
    VersionPresentationMappingsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionPresentationMapping'
        meta:
          $ref: '#/components/schemas/MetaResponse'
    MappingInfo:
      type: object
      properties:
        id:
          type: string
          description: 'ID contains the tmsID that the presentation is mapped to.

            This can be either user-provided ID or a gracenote mapped ID.'
        origin:
          type: string
          description: 'The possible values fr origin are sourceProvided and gracenote.

            If the user-provided TmsID is used, the origin is sourceProvided.

            If a gracenote provided TmsID is used, or if gracenote replaces the

            user-provided TmsID, gracenote is used.'
        type:
          type: string
          description: 'Type describes the type of ID that was used for mapping the presentation.

            Currently, only tmsID is supported.'
      description: 'MappingInfo contains information about how the

        TmsID was determined for the presentation.'
    Descriptions:
      title: Descriptions is an array of Description types
      type: array
      description: A maximum of 10 descriptions can be assigned to a program
      items:
        $ref: '#/components/schemas/Description'
    ShowPresentation:
