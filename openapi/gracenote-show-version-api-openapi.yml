openapi: 3.2.0
info:
  title: GN IDS API v1.9.3 Show Version API
  description: 'The purpose of this application is to provide an API to create, retrieve, update, delete,

    and publish client programs.'
  version: 1.9.3
servers:
- url: /proxy/gnids/api/v1
tags:
- name: show-version
paths:
  /shows/{gnID}/versions:
