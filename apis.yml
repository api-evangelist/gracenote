apis:
- aid: gracenote:onconnect-api
  name: Gracenote OnConnect API
  description: >-
    The Gracenote OnConnect API delivers TV and video data including schedules, programs, celebrities,
    sports, images, and station lineups. Designed for mobile apps, connected TVs, EPGs, and streaming
    experiences, OnConnect provides reliable access to entertainment metadata used to power discovery,
    search, and recommendation features.
  humanURL: https://developer.tmsapi.com/
