- aid: gracenote:sports-mcp-server
  name: Gracenote Sports MCP Server
  description: >-
    A production remote Model Context Protocol server for live, upcoming and recent sports — eleven tools
    covering entity resolution, event discovery, match info, recaps, lineups, where-to-watch, team and
    athlete profiles, league profiles, standings and imagery. It enforces an identity-first call pattern:
    names are resolved to Gracenote IDs before any other tool runs. OAuth 2.0 protected, with full RFC
    9728 and RFC 8414 discovery.
