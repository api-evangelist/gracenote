- aid: gracenote:gn-ids-api
  name: Gracenote GN IDS API
  description: >-
    The GN IDS API is the only write surface Gracenote publishes. It lets content providers create,
    retrieve, update, delete and publish programs into Gracenote-licensed datasets across 85+
    countries using Gracenote's video IDs — movie roots, versions and presentations, show roots,
    versions, presentations, seasons and episodes, plus images, catalogs, bulk batches and exports.
    45 of its 74 operations mutate state.
  humanURL: https://devportal.gracenote.com/video/gn-ids-api/about-gn-ids-api
