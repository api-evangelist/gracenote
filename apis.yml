- aid: gracenote:on-api
  name: Gracenote On API
  description: >-
    The On API is Gracenote's database-ingestion surface for television schedule data and related
    information — programs, schedules, celebrities, lineups, sources, sports events, teams, venues,
    video popularity and the controlled vocabulary behind them. It is built for platforms that pull
    updates on demand into their own store rather than querying per user request, and Gracenote
    recommends a maximum page limit of 1000 across all endpoints.
  humanURL: https://devportal.gracenote.com/video/on-api/about-the-on-api
  baseURL: https://on-api.gracenote.com
