- aid: gracenote:video-mcp-server
  name: Gracenote Video MCP Server
  description: >-
    A production remote Model Context Protocol server that grounds LLM responses in Gracenote's verified
    video metadata — more than 55 million titles plus continually updated viewing availability. Nine tools
    cover entity resolution, streaming availability, root and TMSID metadata, images, cast, awards, content
    ratings and a web-search pre-processing step. OAuth 2.0 protected, with RFC 9728 protected-resource
    metadata, RFC 8414 authorization-server metadata and dynamic client registration.
  humanURL: https://devportal.gracenote.com/video/video-mcp-server/intro
