aid: gracenote
name: Gracenote
description: >-
  Gracenote, a Nielsen company, provides entertainment metadata, content recognition technology, and
  developer APIs for the TV, video, music, sports and automotive industries, powering content
  discovery, search and personalization across linear and streaming services worldwide. It publishes
  ten first-party OpenAPI 3.1.1 definitions covering 298 operations — TV schedules and program data
  (On API, OnConnect, GVD), the GN IDS content-submission API, global music data (GMD v2 and v3
  Beta), automotive in-car entertainment (Nexus) and global sports data — plus two production Model
  Context Protocol servers for video and sports that ground LLM answers in Gracenote's verified
  metadata. Access is licensed through sales rather than self-serve.
