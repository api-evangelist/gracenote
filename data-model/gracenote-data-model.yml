shape_note: >-
  Video identity is a four-level hierarchy — Root → Version → Presentation → (Season → Episode) — and
  that hierarchy is the reason the GN IDS API needs 74 operations to manage what looks from the outside
  like "a TV show". Sports identity is a parallel hierarchy: Sport → Series/League → Season → Match,
  with Team and Person crossing it.
