description: >-
  Gracenote publishes no prices, no tiers and no self-serve plans. Access to every API is licensed
  through a sales conversation. The developer portal states it directly in its own onboarding copy:
  "New to Gracenote? Create an account and contact Sales for an API key." A portal account can be
  self-registered; a key cannot. There is no pricing page on gracenote.com and none on the developer
  portal — the portal's primary call to action is a "Contact Sales" link to
  https://gracenote.com/?form=contact-us.
