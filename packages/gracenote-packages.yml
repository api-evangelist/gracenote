finding: >-
  The strongest decay signal available here is the absence itself. Gracenote ships two brand-new MCP
  servers (2026) and a freshly rebuilt developer portal, and still offers no installable client for any
  language. The documented integration path for MCP is hand-written code against an OAuth token
  endpoint, with Python snippets in the docs rather than a package.
