description: >-
  Gracenote publishes no first-party client library to any public package registry. Its SDKs are real
  and substantial — GNSDK, GNSDK for Mobile, GNSDK for Auto, the Nexus Auto SDK — but all of them are
  distributed as licensed downloads through a Flexera-hosted "Dev Zone" entitlement portal, gated
  behind a customer account. There is nothing an agent or a developer can `npm install` or `pip
  install`. Every Gracenote package on npm is a community wrapper.
